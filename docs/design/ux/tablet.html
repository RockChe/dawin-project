<!doctype html>
<html lang="zh-Hant" data-theme="light" data-clouds="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大雲文創專案管理系統 · 平板版 UX 原型</title>
<link rel="stylesheet" href="ux.css">
<style>
/* ===== 平板原型專用 token（色相沿用 ux.css；僅補「文字用深色變體」與「填色/反白」以達 AA） ===== */
:root{
  --fill:var(--accent-dark);--on:#fff;--link:var(--accent-dark);--focus:#1F7AA6;
  --bd2:color-mix(in srgb,var(--text-sec) 78%,var(--surface));
  --tx-red:color-mix(in srgb,var(--red) 62%,#000);--tx-amber:color-mix(in srgb,var(--amber) 55%,#000);
  --tx-green:color-mix(in srgb,var(--green) 58%,#000);--tx-purple:color-mix(in srgb,var(--purple) 70%,#000);
  --tx-pink:color-mix(in srgb,var(--pink) 62%,#000);--tx-cyan:color-mix(in srgb,var(--cyan) 60%,#000);
  --tx-accent:var(--accent-dark);--tx-hold:var(--text-sec);--on-g:#fff;
  --toast-bg:#1F2530;--toast-fg:#fff;--bezel:#12161d;
}
[data-theme="dark"]{
  --fill:var(--accent);--on:#0E1A22;--link:var(--accent);--focus:#7FD0EA;
  --tx-red:var(--red);--tx-amber:var(--amber);--tx-green:var(--green);--tx-purple:var(--purple);
  --tx-pink:var(--pink);--tx-cyan:var(--cyan);--tx-accent:var(--accent);--on-g:#0E1A22;
  --toast-bg:#E6ECF2;--toast-fg:#1A1E26;--bezel:#05070a;
}
html{scroll-behavior:auto}
body{min-height:100vh}

/* ===== 原型工具列（畫布之外） ===== */
.tb{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.tb h1{font-size:14px;font-weight:700;margin-right:4px}
.tb .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tb .lbl{font-size:12px;color:var(--text-sec);margin-right:2px}
.tbtn{border:1px solid var(--bd2);background:var(--surface);color:var(--text);border-radius:99px;padding:4px 12px;font-family:inherit;font-size:12px;font-weight:600;line-height:1.4;cursor:pointer}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--fill);border-color:var(--fill);color:var(--on)}
.tb :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stage{padding:24px 24px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
#wrap{position:relative;flex:none}
#sizeLbl{font-size:12px;color:var(--text-sec)}

/* ===== 畫布 ===== */
.cv{position:absolute;left:0;top:0;display:flex;overflow:hidden;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;border-radius:18px;transform-origin:0 0;box-shadow:0 0 0 10px var(--bezel),var(--shadow-lg)}
.cv *{box-sizing:border-box}
.cv button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cv :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cv.land{--lw:260px}.cv.port{--lw:224px}
.cv h1,.cv h2,.cv h3{margin:0}
.cv svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cv svg.ic.g{fill:currentColor;stroke:none}
.cv .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cv .mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Consolas,monospace}
.cv .sec{color:var(--text-sec)}.cv .lnk{color:var(--link)}
.cv .tred{color:var(--tx-red)}.cv .tamb{color:var(--tx-amber)}.cv .tgrn{color:var(--tx-green)}.cv .tpink{color:var(--tx-pink)}.cv .tpur{color:var(--tx-purple)}.cv .tacc{color:var(--tx-accent)}

/* 左側窄導覽列 */
.rail{width:96px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:4px;position:relative;z-index:5}
.cv.port .rail{width:84px}
.brand{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:19px;margin:4px 0 12px}
.nv{position:relative;width:100%;min-height:64px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--text-sec)}
.nv.on{background:color-mix(in srgb,var(--fill) 14%,transparent);color:var(--link);font-weight:700}
.nv.on::before{content:"";position:absolute;left:-8px;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--fill)}
.rail .sp{flex:1}
.acct{width:100%;min-height:56px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--text-sec)}
.acct .av2{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--cyan) var(--tint),var(--surface));color:var(--tx-cyan);display:grid;place-items:center;font-weight:700;font-size:14px}
.verbox{width:100%;border-top:1px solid var(--border);margin-top:4px;padding-top:6px;text-align:center;font-size:11px;color:var(--text-sec)}
.verbox a{display:flex;align-items:center;justify-content:center;min-height:36px;position:relative;font-size:13px;color:var(--link);text-decoration:underline;text-underline-offset:3px}
.verbox a::after{content:"";position:absolute;inset:-4px 0}
.amenu{position:absolute;left:calc(100% - 6px);bottom:84px;width:200px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:4px;z-index:40}
.amenu button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:0;background:transparent;border-radius:8px;padding:0 12px;text-align:left;font-size:14px}
.amenu button:hover{background:var(--surface-hover)}
.amenu .out{color:var(--tx-red)}

/* 主區 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:16px 24px 8px;flex-wrap:wrap}
.cv.port .top{padding:16px 20px 8px}
.top .tl{display:flex;flex-direction:column;gap:4px;min-width:0}
.top .tt{display:flex;align-items:center;gap:8px;min-width:0}
.top h1{font-size:22px;line-height:1.3;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tr{display:flex;align-items:center;gap:8px}
.crumbs{font-size:13px;min-height:24px}
.crumbs .cr{border:0;background:transparent;color:var(--link);padding:0 4px;min-height:28px;position:relative;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.crumbs .cr::after{content:"";position:absolute;inset:-8px -2px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:12px;width:18px;height:18px;color:var(--text-sec);pointer-events:none}
.cv .search input{width:210px;padding-left:38px;padding-right:40px}
.search .clr{position:absolute;right:0;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;color:var(--text-sec)}
.iconbtn{width:44px;height:44px;border:1px solid var(--bd2);background:var(--surface);border-radius:12px;display:grid;place-items:center;color:var(--text)}
.ovr{text-align:right;line-height:1.1}.ovr small{display:block;font-size:12px;color:var(--text-sec)}.ovr b{font:700 22px "JetBrains Mono",ui-monospace,monospace;color:var(--link)}
.body{flex:1;min-height:0;overflow:auto;padding:8px 24px 32px;overscroll-behavior:contain}
.cv.port .body{padding:8px 20px 32px}
.body.fill{display:flex;flex-direction:column;overflow:hidden}
.view{display:contents}

/* 表單元件 */
.cv input,.cv select,.cv textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--bd2);border-radius:10px;min-height:44px;padding:0 12px;max-width:100%}
.cv textarea{padding:10px 12px;width:100%;resize:vertical;min-height:88px}
.cv input::placeholder{color:var(--text-sec)}
.cv select{padding-right:8px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.fl{font-size:13px;font-weight:600;color:var(--text-sec)}
.fld .hint{font-size:12px;color:var(--text-sec);font-weight:400}
.btn,.cv .btn{min-height:44px;padding:0 20px;font-size:15px;background:var(--fill);border:1px solid var(--fill);color:var(--on);border-radius:99px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.cv .btn.ghost{background:transparent;color:var(--link);border-color:var(--link)}
.cv .btn.danger{background:transparent;color:var(--tx-red);border-color:var(--tx-red)}
.cv .btn.plain{background:var(--surface);color:var(--text);border-color:var(--bd2);font-weight:600}
.cv .btn .ic{width:18px;height:18px}
.cv .btn[disabled],.cv .btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.cv .chip{position:relative;min-height:36px;padding:0 14px;font-size:14px;border-color:var(--bd2);color:var(--text);gap:6px}
.cv .chip::after{content:"";position:absolute;inset:-4px}
.cv .chip.on{background:var(--fill);border-color:var(--fill);color:var(--on);font-weight:700}
.cv .chip.sc.on{background:color-mix(in srgb,var(--sc) 22%,var(--surface));border:2px solid var(--sc);color:var(--sctx);padding:0 13px}
.cv .chip .ic{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:99px;overflow:hidden;background:var(--surface-light)}
.seg button{position:relative;min-height:44px;padding:0 16px;border:0;background:transparent;color:var(--text);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--on);font-weight:700}
.cb{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.cb i{width:24px;height:24px;border:2px solid var(--bd2);border-radius:7px;display:grid;place-items:center;background:var(--surface);color:transparent}
.cb i .ic{width:16px;height:16px;stroke-width:3}
.cb[aria-checked="true"] i{background:var(--tx-green);border-color:var(--tx-green);color:var(--on-g)}
.sw{position:relative;width:56px;height:32px;border-radius:99px;border:2px solid var(--bd2);background:var(--surface-light);padding:0;flex:none}
.sw::before{content:"";position:absolute;inset:-8px -2px}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--text-sec);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--fill);border-color:var(--fill)}
.sw[aria-checked="true"] i{transform:translateX(24px);background:var(--on)}
.grip{width:44px;height:44px;border:0;background:transparent;color:var(--text-sec);display:grid;place-items:center;flex:none;touch-action:none;cursor:grab;border-radius:8px}
.grip .ic{width:20px;height:20px}
.dragging{box-shadow:0 8px 24px rgba(0,0,0,.25);outline:2px solid var(--fill);outline-offset:-2px;position:relative;z-index:6;background:var(--surface)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 16px;text-align:center}
.empty b{font-size:17px}.empty p{margin:0;color:var(--text-sec);font-size:14px}
.empty.plain{border:1px dashed var(--bd2);border-radius:12px}

/* 雲朵 + 關閉時的替代 */
.fb{display:none}
.k-white{--kc:var(--accent);--kt:var(--tx-accent)}.k-pink{--kc:var(--pink);--kt:var(--tx-pink)}.k-purple{--kc:var(--purple);--kt:var(--tx-purple)}.k-dark{--kc:var(--red);--kt:var(--tx-red)}.k-nimbus{--kc:var(--green);--kt:var(--tx-green)}
[data-clouds="off"] [data-cloud]{display:none!important}
[data-clouds="off"] .fb,.fb.force{display:inline-flex}
.fb-dot{width:10px;height:10px;border-radius:50%;background:var(--kc);flex:none}
.fb-big,.fb-t{align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--kc);color:var(--kt);font:700 24px/1 inherit;flex:none}
.fb-t{border-width:2px;font-size:20px}
.runwrap{position:relative;margin-top:30px}
.run{position:absolute;bottom:2px;transform:translateX(-50%);line-height:0;display:flex}
.run .fb-dot{width:12px;height:12px;margin-bottom:-3px;border:2px solid var(--surface)}

/* 卡片 / 區塊 */
.cv .card{border-radius:14px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chead h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.chead h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--hc,var(--fill))}
.cnt{font:400 13px "JetBrains Mono",ui-monospace,monospace;color:var(--text-sec)}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px}
.cv.port .grid2{grid-template-columns:1fr}
.stack{display:flex;flex-direction:column;gap:16px}

/* 狀態 / 人員（覆寫文字深度以達 AA；底色與色相沿用 ux.css） */
.cv .st{font-size:13px;padding:2px 10px;min-height:26px}
.cv .st.done{color:var(--tx-green)}.cv .st.doing{color:var(--tx-amber)}.cv .st.todo{color:var(--tx-accent)}.cv .st.hold{color:var(--tx-hold)}.cv .st.prop{color:var(--tx-pink)}.cv .st.conf{color:var(--tx-purple)}
.cv button.st{border:0;position:relative;cursor:pointer}
.cv button.st::after{content:"";position:absolute;inset:-9px -4px}
.cv button.st .ic{width:14px;height:14px}
.cv .pp{font-size:13px;min-height:24px;margin-right:0}
.cv .pp.a{color:var(--tx-purple)}.cv .pp.b{color:var(--tx-red)}.cv .pp.c{color:var(--tx-accent)}.cv .pp.d{color:var(--tx-amber)}.cv .pp.e{color:var(--tx-green)}
.cv .pp.f{color:var(--tx-cyan);background:color-mix(in srgb,var(--cyan) var(--tint),transparent)}
.cv .pp .w{font-size:11px;padding:0 5px;background:var(--fill);color:var(--on);font-weight:700}
.pps{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:1px dashed color-mix(in srgb,var(--c) 60%,transparent)}
.av.lg{width:56px;height:56px;border-radius:14px;font-size:24px}
.bar{height:8px}.bar>i{background:var(--c,var(--accent))}
.pct{font:600 15px "JetBrains Mono",ui-monospace,monospace}
.tag-tb{font-size:11px;color:var(--text-sec);margin-left:4px}

/* 專案卡 / 專案頁 */
.ms{display:grid;grid-template-columns:372px 1fr;gap:16px;flex:1;min-height:0}
.ms>.col{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding:2px 2px 16px}
.ptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:8px 12px 12px 4px;cursor:pointer}
.pcard.sel{border:2px solid var(--fill);padding:7px 11px 11px 3px;background:color-mix(in srgb,var(--fill) 7%,var(--surface))}
.pcard .r1{display:flex;align-items:center;gap:8px}
.pcard .nm{flex:1;min-width:0}
.pcard .nm b{display:block;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .nm small{font-size:13px;color:var(--text-sec)}
.pcard .pb{padding:0 4px 0 12px}
.pcard .r3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0 0 12px}
.pcard .r3 .eye{margin-left:auto}
.pl-compact .pcard .r3,.pl-compact .pcard .nm small{display:none}
.pl-compact .pcard .pb{margin-top:0}
.pl-compact .runwrap{margin-top:22px}
.pgrid{display:flex;flex-direction:column;gap:12px}
.cv.port .pgrid{display:grid;grid-template-columns:1fr 1fr}
.eye{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;color:var(--text-sec);flex:none;border-radius:10px}
.eye[aria-pressed="true"]{color:var(--text-sec);opacity:.8}
.archh{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:0 12px;font-weight:700;font-size:15px}
.arch{display:flex;align-items:center;gap:8px;background:var(--surface-light);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
.arch .nm{flex:1;min-width:0}.arch .nm b{display:block}.arch small{color:var(--text-sec)}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.phead .info{flex:1;min-width:200px}
.phead h2{font-size:22px;line-height:1.3}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:flex;flex-direction:column;gap:12px}
.cv.port .kpis{flex-direction:row}.cv.port .kpis>*{flex:1;min-width:0}
.dg{display:grid;gap:16px;margin-top:16px}
.cv.land .dg{grid-template-columns:268px 1fr;align-items:start}
.kcard{padding:16px}
.kcard .l{font-size:13px;color:var(--text-sec);margin-bottom:4px}
.kcard .n{font:700 30px/1.1 "JetBrains Mono",ui-monospace,monospace}
.kcard .n small{font-size:17px;color:var(--text-sec);font-weight:400}

/* 任務清單 */
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--surface-light);border-bottom:1px solid var(--border);font-size:13px}
.frow .lb{color:var(--text-sec);font-size:13px;margin-left:4px}
.frow select{min-height:40px;border-radius:99px;font-size:14px}
.trow{border-bottom:1px solid var(--border);background:var(--surface);position:relative}
.trow:last-child{border-bottom:0}
.tmain{display:flex;align-items:center;gap:4px;padding:6px 12px 6px 4px}
.tinfo{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:10px;min-height:56px}
.tinfo b{display:block;font-size:15px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinfo .mt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--text-sec)}
.tprog{width:112px;flex:none;text-align:right}
.tprog .bar{margin-top:6px}
.tprog span{font:600 13px "JetBrains Mono",ui-monospace,monospace}
.stwrap{position:relative;flex:none}
.smenu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;min-width:176px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:4px}
.smenu .mi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;border:0;background:transparent;border-radius:8px;padding:0 10px}
.smenu .mi:hover{background:var(--surface-hover)}
.subs{padding:0 12px 4px 48px}
.srow{display:flex;align-items:center;gap:2px;min-height:44px;border-top:1px dashed var(--border)}
.srow:first-child{border-top:0}
.srow .sn{flex:1;min-width:0;font-size:14px}
.srow .sn.dn{color:var(--text-sec);text-decoration:line-through}
.srow .grip{width:36px}
.srow .ownbtn{border:0;background:transparent;min-height:44px;padding:0 4px;position:relative}
.addsub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0 10px}
.addsub input{flex:1;min-width:160px}
.addlnk{border:0;background:transparent;color:var(--link);font-weight:600;min-height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:4px}
.addlnk .ic{width:18px;height:18px}
.picker{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 8px 44px}

/* 甘特 */
.gtools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.gtools .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gscroll{position:relative;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;overscroll-behavior:contain}
.ginner{position:relative;min-width:100%}
.ghead{display:flex;position:sticky;top:0;z-index:4;background:var(--surface-light);border-bottom:1px solid var(--border);height:56px}
.grow{display:flex;height:52px;border-bottom:1px solid var(--border);background:var(--surface)}
.grow.proj{background:color-mix(in srgb,var(--surface-light) 70%,var(--surface))}
.grow.child .gl{padding-left:24px}

/* ============================== 甘特 ============================== */
function ghead(scale,ppd,X){
  let m='',d='';
  for(let mo=new Date(R0);mo<=R1;mo=new Date(mo.getFullYear(),mo.getMonth()+1,1)){
    if(scale==='季'){if(mo.getMonth()%3===0)m+=`<span style="left:${X(mo)}px">${mo.getFullYear()} Q${Math.floor(mo.getMonth()/3)+1}</span>`}
    else m+=`<span style="left:${X(mo)}px">${(mo.getMonth()===0||mo.getTime()===R0.getTime())?mo.getFullYear()+' ':''}${mo.getMonth()+1}月</span>`;
  }
  for(let i=0;i<DAYS;i++){const dt=addD(R0,i);
    if(scale==='日')d+=`<span style="left:${Math.round(i*ppd)}px;width:${Math.round(ppd)}px">${dt.getDate()}</span>`;
    else if(scale==='週'&&dt.getDay()===1)d+=`<span style="left:${Math.round(i*ppd)}px">${dt.getMonth()+1}/${dt.getDate()}</span>`;}
  return {m,d};
}
/* rows: {id,type,left,start,end,prog,color,edit,child} ；回傳整個甘特 */
function gantt(key,rows,o){
  const ppd=PPD(o.view,o.scale),W=Math.round(DAYS*ppd),X=dt=>Math.round(diff(dt,R0)*ppd);
  const h=ghead(o.scale,ppd,X);
  let grid='';for(let mo=new Date(R0);mo<=R1;mo=new Date(mo.getFullYear(),mo.getMonth()+1,1))grid+=`<i class="gl1" style="left:calc(var(--lw) + ${X(mo)}px)"></i>`;
  const sk=!!o.sky, tx=X(TODAY)+Math.round(ppd/2);
  const row=r=>{
    const s=D(r.start),e=D(r.end),l=X(s),w=Math.max(10,Math.round((diff(e,s)+1)*ppd));
    const tip=S.tip===r.id, pj0=r.type==='proj';
    /* sky 模式（總覽／時程）：進度尖端的筋斗雲跑者、逾期尾端的烏雲＋雨 */
    const rs=pj0?26:20, run=sk&&w>=44?`<span class="grun" style="left:clamp(${rs/2}px,${r.prog}%,calc(100% - ${rs/2}px))">${cl('nimbus',rs)}</span>`:'';
    const ox=!sk||!r.od?null:pj0?Math.min(l+w-14,Math.max(l+14,X(D(r.od))+Math.round(ppd/2))):l+w;
    const over=ox===null?'':`<span class="gover" style="left:${ox}px">${cl('dark',pj0?26:22)}<span class="rain" aria-hidden="true"><i></i><i></i><i></i></span><span class="sr">逾期</span></span>`;
    const shift=ox!==null&&!pj0?24:0;
    return `<div class="grow ${r.type}${r.child?' child':''}" data-id="${r.id}"${r.item?' data-item':''}>
      <div class="gl">${r.left}</div>
      <div class="gt" style="width:${W}px">
        <div class="gbar${r.edit?' edit':''}" data-id="${r.id}" style="left:${l}px;width:${w}px;--c:${r.color}" ${r.edit?'':`data-act="tip" role="button" tabindex="0" aria-label="${esc(r.label)}：${fFull(s)} 到 ${fFull(e)}，進度 ${r.prog}%${r.od?'，有逾期':''}"`}>
          <i class="gp" style="width:${r.prog}%"></i>${run}${r.edit?'<b class="gh l" data-h="l"></b><b class="gh r" data-h="r"></b>':''}
        </div>${over}
        <span class="gpct" style="left:${l+w+(r.edit?30:8)+shift}px">${tip?`${fFull(s)} → ${fFull(e)}　`:''}${r.prog}%</span>
      </div></div>`};
  let body='';
  if(o.groups)body=o.groups.map(g=>`<div class="ggrp${g.wx?' k-'+g.wx:''}${S.tlWx&&S.tlWx!==g.wx?' dim':''}${S.tlWx&&S.tlWx===g.wx?' hl':''}" data-id="${g.id}"${g.wx?` data-wx="${g.wx}"`:''} data-item>${g.rows.map(row).join('')}</div>`).join('');
  else body=`<div class="grows" data-kind="${o.kind||''}" data-p="${o.p||''}">${rows.map(row).join('')}</div>`;
  const style=o.fill?'flex:1;min-height:0':`max-height:${o.h||340}px`;
  /* 天空帶：月份軸上方一條極淡的帶，2–3 朵裝飾雲（opacity .08、aria-hidden；雲朵關閉時整條隱藏） */
  const sky=sk?`<div class="gsky" aria-hidden="true">${[[-130,'white'],[110,'nimbus'],[340,'white']].map(([dx,k])=>`<span class="cl" data-cloud="${k}" data-size="44" style="left:${tx+dx}px"></span>`).join('')}</div>`:'';
  return `<div class="gscroll${sk?' sky':''}" data-gk="${key}" data-tx="${tx}"${sk?' data-sky="1"':''} style="${style}"><div class="ginner" style="width:calc(var(--lw) + ${W}px)">
    <div class="ghead"><div class="gl">${o.hl||'任務'}</div><div class="gt gh2" style="width:${W}px">${sky}<div class="gtag" style="left:${tx}px"><span>今天</span>${sk?`<em class="gflag" aria-hidden="true">${cl('white',22,{nofb:true})}</em>`:''}</div><div class="gm">${h.m}</div><div class="gd">${h.d}</div></div></div>
    ${grid}<div class="gtoday" style="left:calc(var(--lw) + ${tx}px)"></div>${body}</div></div>`;
}

  return l.map((t,i)=>[t,i]).sort(([a,ai],[b,bi])=>{const x=k(a),y=k(b);if(x===null||y===null)return x===y?ai-bi:x===null?1:-1;

/* 3 我的任務 */
function mineGroups(){
  const g={overdue:[],soon:[],later:[],done:[]},sel=S.mineSel;
  T.filter(t=>allOwn(t).includes(ME)&&matchQ(t)).forEach(t=>{
    if(t.status==='已完成'){if(sel.includes('已完成'))g.done.push(t);return}
    if(sel.length&&!sel.includes(t.status))return;
    const d=dl(t);if(d!==null&&d<0)g.overdue.push(t);else if(d!==null&&d<=7)g.soon.push(t);else g.later.push(t)});
  Object.values(g).forEach(a=>a.sort((x,y)=>(x.end||'9')<(y.end||'9')?-1:1));return g;
}
SCREENS.mine=()=>{
  const k=mineK();
  const g=mineGroups(),tot=g.overdue.length+g.soon.length+g.later.length+g.done.length;
  const kp=[['dark',k.od,'已逾期','tred'],['pink',k.soon,'7 天內到期','tpink'],['white',k.ip,'進行中',''],['nimbus',k.dm,'本月已完成','tgrn']];
  const secs=[['overdue','逾期','dark','var(--red)','tred'],['soon','7 天內','pink','var(--pink)','tpink'],['later','之後','purple','var(--purple)','tpur'],['done','已完成','nimbus','var(--green)','tgrn']];
  const row=(t,c)=>{const d=dl(t),p=prog(t),b=roleBadge(t);
    return `<button class="mrow" data-act="open" data-id="${t.id}"><i class="dot" style="background:${pj(t.p).c}"></i><div class="nm"><b>${esc(t.name)}${b?`<span class="badge">${b}</span>`:''}</b><small>${esc(pj(t.p).name)}</small></div>${stChip(t.status)}<div class="mb">${plainBar(p,'var(--accent)')}</div><div class="dd"><b class="${c}">${d===null?'—':d+'d'}</b><small>${fD(t.end)}</small></div></button>`};
  const chip=s=>{const on=s==='全部'?!S.mineSel.length:S.mineSel.includes(s),m=STM[s];
    return `<button class="chip${m?' sc':''}${on?' on':''}" ${m?`style="--sc:var(${m.c});--sctx:var(${m.t})"`:''} data-act="msel" data-v="${s}" aria-pressed="${on}">${on&&m?ic('check'):''}${s}</button>`};
  return V('mine',`
   <div class="kp4">${kp.map(([c,n,l,t])=>`<div class="card kp"><div><div class="n ${t}">${n}</div><div class="l">${l}</div></div>${cl(c,44)}</div>`).join('')}</div>
   <div class="chips" style="margin-bottom:16px" role="group" aria-label="狀態篩選（可複選）">${['全部',...STFILT].map(chip).join('')}</div>
   ${tot===0?`<div class="card empty">${S.mineSel.length||S.q?`${cl('purple',96)}<b>沒有符合篩選的任務</b><p>換個狀態，或清除篩選</p><button class="btn ghost" data-act="msel" data-v="全部">清除篩選</button>`:`${cl('nimbus',96)}<b>沒有指派給你的任務</b><p>今天可以喘口氣了</p>`}</div>`:''}
   ${secs.map(([key,l,cc,col,tc])=>g[key].length?`<div class="card grp2" data-grp="${key}"><h3 class="gh3" tabindex="-1" style="border-left:4px solid ${col}">${key==='later'?`<i class="dot" style="background:var(--purple);width:12px;height:12px"></i>`:cl(cc,28)}<span>${l}</span><span class="cnt">${g[key].length}</span></h3>${g[key].map(t=>row(t,tc)).join('')}</div>`:'').join('')}`);
};

/* 4 專案（橫向＝主從；直向＝清單） */

  const pt=ptasks(p.id),a=pavg(p.id),c=statusCounts(p.id),hid=S.hidden.has(p.id);
  return `<article class="pcard${sel?' sel':''}" data-act="pick" data-id="${p.id}" data-item role="button" tabindex="0" aria-label="${esc(p.name)}，${pt.length} 任務，進度 ${a}%">
   <div class="r1"><button class="grip" data-grip="projs" aria-label="拖移專案排序" data-keep>${ic('grip')}</button><span class="av" style="--c:${p.c}">${esc(p.name[0])}</span>
    <div class="nm"><b>${esc(p.name)}</b><small>${pt.length} 任務 · ${nsubs(p.id)} 子任務</small></div><span class="pct ${a===100?'tgrn':''}">${a}%</span></div>
   <div class="pb">${runBar(a,p.c)}</div>
   <div class="r3">${Object.entries(c).map(([s,n])=>`<span class="st ${STM[s].k}">${s} ${n}</span>`).join('')}
     <button class="eye" data-act="eye" data-id="${p.id}" aria-pressed="${hid}" aria-label="${hid?'已在時程隱藏，點一下顯示':'顯示於時程，點一下隱藏'}">${ic(hid?'eyeoff':'eye')}</button></div>
  </article>`;
}
function projTools(){

   <div class="seg" role="group" aria-label="檢視模式">${[['card','卡片'],['list','明細']].map(([k,l])=>`<button data-act="pview" data-v="${k}" aria-pressed="${S.pview===k}">${l}</button>`).join('')}</div>

/* 7 時程 */
SCREENS.timeline=()=>{
  let ps=visibleProjects().filter(p=>!S.hidden.has(p.id));
  if(S.tlSort==='name')ps=ps.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  else if(S.tlSort==='progress')ps=ps.slice().sort((a,b)=>pavg(b.id)-pavg(a.id));
  else if(S.projOrder)ps=ps.slice().sort((a,b)=>S.projOrder.indexOf(a.id)-S.projOrder.indexOf(b.id));
  const allC=ps.every(p=>!S.tlOpen.has(p.id));
  const groups=ps.map(p=>{const r=projRange(p.id);if(!r)return null;const open=S.tlOpen.has(p.id),w=weather(p);
    const g=[{id:p.id,type:'proj',label:p.name,start:r.start,end:r.end,prog:pavg(p.id),color:p.c,od:odEnd(p.id),
      left:`<button class="gchev" data-act="tlpick" data-id="${p.id}" aria-expanded="${open}" aria-label="${open?'收折':'展開'}${esc(p.name)}">${ic(open?'chevD':'chevR')}</button><i class="pbar" style="--c:${p.c}"></i>${cl(w.k,28)}<span class="gtx" title="${ptasks(p.id).length} 任務 · ${w.lab}"><b>${esc(p.name)}</b><small class="${w.cls}">${w.lab}</small></span><button class="grip" data-grip="projs" aria-label="拖移專案排序">${ic('grip')}</button>`}];
    if(open)ptasks(p.id).filter(t=>t.start&&t.end).forEach(t=>{const od=isOd(t);g.push({id:t.id,type:'task',child:true,label:t.name,start:t.start,end:t.end,prog:prog(t),color:p.c,od:od?t.end:null,
      left:`${stCloud(t,24)}<span class="gtx"><b class="n">${esc(t.name)}</b><small class="${od?'tred':''}">${t.status}${od?` · 逾期 ${-dl(t)} 天`:''}</small></span>`})});
    return {id:p.id,wx:w.k,rows:g}}).filter(Boolean);
  const all=groups.flatMap(g=>g.rows);
  const wxc=k=>groups.filter(g=>g.wx===k).length;
  const wxRow=`<div class="wxrow" role="group" aria-label="專案天氣（點一下標出該類專案）"><span class="lb">專案天氣</span>${WXORDER.map(k=>`<button class="chip wxc k-${k}${S.tlWx===k?' on':''}" data-act="tlwx" data-v="${k}" aria-pressed="${S.tlWx===k}"${wxc(k)?'':' aria-disabled="true"'}>${cl(k,28)}<span>${WX[k].short}</span><b>${wxc(k)}</b></button>`).join('')}</div>`;
  const LEG={dark:['雷雨／逾期','有任務逾期，條尾下雨'],nimbus:['順風飛行／完成','進度領先，跑者標進度'],white:['晴時多雲／進行中','沒有逾期'],purple:['起霧休息／暫緩','先放一邊'],pink:['醞釀中／提案中','含待確認']};
  const legend=`<div class="wleg" aria-label="雲朵圖例">${WXORDER.map(k=>`<div>${cl(k,24)}<span><b>${LEG[k][0]}</b>　${LEG[k][1]}</span></div>`).join('')}</div>`;
  return V('timeline',`${S.tlTip?`<div class="tipbox pk">${cl('pink',36)}<div class="tx"><b>預設收折所有專案</b>點專案名稱旁的箭頭，或按「全部展開」查看任務。</div><button class="x" data-act="tlTipX" aria-label="關閉提示">${ic('x',18)}</button></div>`:''}
   <div class="gtools"><div class="grp"><select data-bind="tlsort" aria-label="排序方式">${[['manual','手動'],['name','名稱'],['progress','進度']].map(([k,l])=>`<option value="${k}"${S.tlSort===k?' selected':''}>排序：${l}</option>`).join('')}</select>
     <button class="btn plain" data-act="tlall">${allC?'全部展開':'全部收折'}</button><button class="btn plain" data-act="gtoday">回到今天</button></div>${scaleSeg(S.tlScale,'tl')}</div>
   ${wxRow}
   ${groups.length?gantt('tl',all,{view:'tl',scale:S.tlScale,fill:true,groups,hl:'專案／任務',sky:true}):`<div class="card empty plain"><b>沒有可顯示的專案</b></div>`}${legend}`);
};

/* ============================== 縮放、主題、雲 ============================== */
function fit(){
  const land=S.orient==='land',w=land?1180:820,h=land?820:1180,cv=$('#cv'),wrap=$('#wrap');
  const aw=Math.max(320,innerWidth-64),ah=Math.max(320,innerHeight-($('.tb').offsetHeight||56)-96);
  const s=S.fit?Math.min(1,aw/w,ah/h):1;S.scale=s;
  cv.style.width=w+'px';cv.style.height=h+'px';cv.style.transform=`scale(${s})`;
  wrap.style.width=Math.round(w*s)+'px';wrap.style.height=Math.round(h*s)+'px';
  $('#sizeLbl').textContent=`畫布 ${w}×${h} px（${land?'橫向':'直向'}）· 目前縮放 ${Math.round(s*100)}%`;
  $('#fitBtn').setAttribute('aria-pressed',S.fit);

/* 拖移：甘特長條（移動／調整日期） */
function startBarDrag(e,bar){
  const t=T.find(x=>x.id===bar.dataset.id);if(!t)return;
  const h=e.target.closest('[data-h]'),mode=h?h.dataset.h:'m',ppd=PPD('detail',S.dScale),sc=S.scale||1;
  const x0=e.clientX,l0=parseFloat(bar.style.left),w0=parseFloat(bar.style.width);bar.setPointerCapture&&bar.setPointerCapture(e.pointerId);
  let dd=0;
  const mv=ev=>{dd=Math.round((ev.clientX-x0)/sc/ppd);const dx=dd*ppd;
    if(mode==='m')bar.style.left=(l0+dx)+'px';else if(mode==='l'){bar.style.left=(l0+dx)+'px';bar.style.width=Math.max(10,w0-dx)+'px'}else bar.style.width=Math.max(10,w0+dx)+'px'};
  const up=()=>{bar.removeEventListener('pointermove',mv);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up);
    if(dd){let s=D(t.start),en=D(t.end);if(mode==='m'){s=addD(s,dd);en=addD(en,dd)}else if(mode==='l')s=addD(s,Math.min(dd,diff(en,s)));else en=addD(en,Math.max(dd,-diff(en,s)));
      t.start=iso(s);t.end=iso(en);toast('ok','已更新日期',`${fFull(s)} → ${fFull(en)}`)}R()};
  bar.addEventListener('pointermove',mv);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up);e.preventDefault();
}
/* 拖移：握把排序（任務／子任務／專案） */
function startReorder(e,grip){
  const item=grip.closest('[data-item]');if(!item)return;const box=item.parentElement,kind=grip.dataset.grip;
  item.classList.add('dragging');grip.setPointerCapture&&grip.setPointerCapture(e.pointerId);
  const mv=ev=>{const sibs=[...box.children].filter(x=>x!==item&&x.hasAttribute('data-item'));let before=null;
    for(const s of sibs){const r=s.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=s;break}}box.insertBefore(item,before)};
  const up=()=>{grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);item.classList.remove('dragging');
    const ids=[...box.children].filter(x=>x.hasAttribute('data-item')).map(x=>x.dataset.id);
    if(kind==='tasks'){const pid=S.proj,full=taskSorted(pid).map(t=>t.id);let k=0;S.order[pid]=full.map(id=>ids.includes(id)?ids[k++]:id);S.view.sort='manual';toast('info','已切換為手動排序')}
    else if(kind==='projs'){const rest=PROJ.map(p=>p.id).filter(id=>!ids.includes(id));S.projOrder=[...ids,...rest];S.psort='manual';S.tlSort='manual';toast('info','已更新專案順序')}
    else if(kind==='subs'){const t=T.find(x=>x.id===box.dataset.tid);t.subs.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));}
    R()};
  grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);e.preventDefault();
}
