<!doctype html>
<html lang="zh-Hant" data-theme="light" data-clouds="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>大雲文創專案管理系統 · 桌面版 UIUX 設計稿（1280）</title>
<link rel="stylesheet" href="ux.css">
<style>
/* ===== 本檔補充（共用 token 在 ux.css）。原則：文字色一律用 --t-*（AA 版），--text-dim 只做裝飾／停用 ===== */
:root,[data-theme="light"]{
  --acc-solid:var(--accent-dark);--on-acc:#fff;--focus:#1F7AA6;--frame:#E4E0D8;
  --t-red:color-mix(in srgb,var(--red) 68%,#000);--t-amber:color-mix(in srgb,var(--amber) 55%,#000);
  --t-green:color-mix(in srgb,var(--green) 58%,#000);--t-pink:color-mix(in srgb,var(--pink) 78%,#000);
  --t-purple:color-mix(in srgb,var(--purple) 82%,#000);--t-accent:color-mix(in srgb,var(--accent) 70%,#000);
  --t-cyan:color-mix(in srgb,var(--cyan) 72%,#000);
}
[data-theme="dark"]{
  --acc-solid:var(--accent);--on-acc:#0E1620;--focus:#7CCBE6;--frame:#0F1218;
  --text-sec:#9CA7B6; /* 比 ux.css 的 #8A95A4 亮一階：hover 列上才過 AA */
  --t-red:color-mix(in srgb,var(--red) 72%,#fff);--t-amber:color-mix(in srgb,var(--amber) 72%,#fff);--t-green:color-mix(in srgb,var(--green) 72%,#fff);--t-pink:color-mix(in srgb,var(--pink) 72%,#fff);
  --t-purple:color-mix(in srgb,var(--purple) 72%,#fff);--t-accent:color-mix(in srgb,var(--accent) 72%,#fff);--t-cyan:color-mix(in srgb,var(--cyan) 72%,#fff);
}
html{scroll-behavior:auto}
body{background:var(--frame);min-width:1280px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.ic{flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic[data-fill]{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* --- 設計稿工具列（畫布外，固定深色，不跟主題）--- */
.tb{position:sticky;top:0;z-index:300;background:#18202B;color:#E8EDF3;font:13px/1.4 "Noto Sans TC",system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tb .r1,.tb .r2{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.tb .r2{border-top:1px solid #2B3646;padding:6px 16px;min-height:36px;color:#B8C4D3}
.tb b{color:#fff}
.tb button{background:transparent;border:1px solid #3C4A5E;color:#E8EDF3;border-radius:8px;padding:3px 10px;font-size:13px}
.tb button:hover{background:#263243}
.tb button[aria-pressed="true"],.tb button.cur{background:#7CCBE6;border-color:#7CCBE6;color:#0E1620;font-weight:700}
.tb :focus-visible{outline-color:#B5E4F3}
.tb .grp{display:flex;gap:4px;flex-wrap:wrap}
.tb .sp{flex:1}
.tb .lab{color:#9FB0C4}
.tb .swl{display:flex;align-items:center;gap:8px}
.sw{position:relative;width:40px;height:22px;border-radius:99px;border:1px solid var(--border);background:var(--surface-hover);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:left .15s}
.sw[aria-checked="true"]{background:var(--acc-solid);border-color:var(--acc-solid)}
.sw[aria-checked="true"]::after{left:20px}
.tb .sw{background:#3C4A5E;border-color:#3C4A5E}.tb .sw[aria-checked="true"]{background:#7CCBE6;border-color:#7CCBE6}
.tb .sw:hover{background:#3C4A5E}.tb .sw[aria-checked="true"]:hover{background:#7CCBE6}

.tbar{display:inline-block;width:3px;height:14px;border-radius:2px;background:var(--c,var(--accent));flex:none}
/* --- 雲寶寶開關：關閉時雲全藏、改顯示 fallback（.fb）；.force-on/.force-off 供對照用 --- */
.fb{display:none}
[data-clouds="off"] [data-cloud]{display:none!important}
[data-clouds="off"] .fb{display:inline-block}
[data-clouds="off"] .fb.skls{display:flex}
.force-off [data-cloud]{display:none!important}.force-off .fb{display:inline-block!important}.force-off .fb.skls{display:flex!important}
.force-on [data-cloud]{display:inline-block!important}.force-on .fb{display:none!important}
.fb.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.fb.logo{width:32px;height:32px;line-height:32px;border-radius:50%;background:var(--acc-solid);color:var(--on-acc);font-weight:700;font-size:17px;text-align:center;flex:none}
.fb.skls{flex-direction:column;gap:6px;width:70%;margin:4px auto}
.fb.skls i{display:block;height:10px;border-radius:5px;background:var(--surface-hover)}.fb.skls i:nth-child(2){width:80%}.fb.skls i:nth-child(3){width:55%}

/* --- 畫布（產品固定 1280）--- */
#canvas{position:relative;width:1280px;margin:16px auto 64px;background:var(--bg);box-shadow:0 8px 40px rgba(0,0,0,.18);border-radius:4px;overflow:hidden}
.screen[hidden]{display:none}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.hr{display:flex;align-items:center;gap:12px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:10px;color:var(--text-sec)}
.search input{width:220px;padding:6px 12px 6px 32px;border-radius:99px;border:1px solid var(--border);background:var(--surface-light);outline:none}
.search input::placeholder{color:var(--text-sec)}
.icbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text-sec);padding:0}
.icbtn:hover{background:var(--surface-hover)}
.vd{width:1px;height:28px;background:var(--border);display:block}
.ov{text-align:right;line-height:1.2}.ov span{display:block;font-size:12px;color:var(--text-sec)}.ov b{font:700 20px "JetBrains Mono",ui-monospace,monospace;color:var(--t-accent)}
.wrap{padding:16px 24px 56px}
.tabs{margin-bottom:12px}
.tabs .t{background:transparent;border:0;border-bottom:2px solid transparent;font:inherit;padding:10px 20px}
.tabs .t:hover{color:var(--text)}
.tabs .t.on{color:var(--t-accent);border-bottom-color:var(--acc-solid)}
.crumbs{margin:0 0 16px;font-size:13px;color:var(--text-sec);min-height:20px}
.crumbs .lnk{background:none;border:0;padding:0;color:var(--t-accent);text-decoration:underline;text-underline-offset:2px}
.crumbs b{color:var(--text)}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.fbar .lab{font-size:12px;color:var(--text-sec);margin-right:4px}
.fbar .sepv{width:1px;height:20px;background:var(--border)}
.fpanel{margin:-8px 0 16px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;gap:8px;flex-wrap:wrap}

/* --- 共用元件覆寫（AA）--- */
.chip{min-height:32px;font-size:13px;color:var(--text-sec)}
.chip:hover{background:var(--surface-hover)}
.chip.on{background:var(--acc-solid);border-color:var(--acc-solid);color:var(--on-acc);font-weight:700}
.chip.sc[aria-pressed="true"]{background:color-mix(in srgb,var(--c) calc(var(--tint) + 6%),var(--surface));border-color:var(--c);color:var(--tc);font-weight:700}
.chip.sm{min-height:26px;padding:1px 10px;font-size:12px}
.chip[aria-pressed="true"].sm:not(.sc){background:color-mix(in srgb,var(--accent) var(--tint),var(--surface));border-color:var(--acc-solid);color:var(--t-accent);font-weight:700}
.btn{background:var(--acc-solid);border-color:var(--acc-solid);color:var(--on-acc);min-height:32px;padding:4px 16px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--t-accent)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--t-red)}
.btn.amber{background:transparent;border-color:var(--amber);color:var(--t-amber)}
.btn.sec{background:var(--surface);border-color:var(--border);color:var(--text-sec)}
.btn.sec:hover{background:var(--surface-hover)}
.btn.sm{min-height:26px;padding:1px 12px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.st{font-size:12px}
.st.done{color:var(--t-green)}.st.doing{color:var(--t-amber)}.st.todo{color:var(--t-accent)}.st.hold{color:var(--text-sec)}.st.prop{color:var(--t-pink)}.st.conf{color:var(--t-purple)}
button.st{border:0;cursor:pointer}
.pp{font-size:12px}
.pp.a{color:var(--t-purple)}.pp.b{color:var(--t-red)}.pp.c{color:var(--t-accent)}.pp.d{color:var(--t-amber)}.pp.e{color:var(--t-green)}
.pp.f{color:var(--t-cyan);background:color-mix(in srgb,var(--cyan) var(--tint),transparent)}
.pp .w{background:var(--acc-solid);color:var(--on-acc);font-weight:600}
.pp .x{background:none;border:0;padding:0 0 0 2px;line-height:1;font-size:14px;color:inherit}
.dim{color:var(--text-dim)}.sec{color:var(--text-sec)}
.mono{font-variant-numeric:tabular-nums}
.badge{font-size:11px;border-radius:6px;padding:0 6px;margin-left:6px;background:color-mix(in srgb,var(--accent) var(--tint),transparent);color:var(--t-accent);font-weight:600;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden;background:var(--surface-light)}
.seg button{border:0;background:transparent;padding:3px 12px;font-size:13px;color:var(--text-sec)}
.seg button:hover{background:var(--surface-hover)}
.seg button[aria-pressed="true"]{background:var(--acc-solid);color:var(--on-acc);font-weight:700}
.fld,.sel{background:var(--surface-light);border:1px solid var(--border);border-radius:8px;padding:6px 10px;outline-offset:0;min-height:32px}
.sel{border-radius:99px;padding:3px 12px;font-size:13px;background:var(--surface)}
textarea.fld{resize:vertical;min-height:64px;width:100%}
.fld.num{width:72px}
.iconx{background:none;border:0;color:var(--text-sec);padding:2px 6px;line-height:1;border-radius:6px;font-size:16px}
.iconx:hover{color:var(--t-red);background:var(--surface-hover)}

/* --- 區塊／標題 --- */
.blk{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.blk+.blk,.mb{margin-bottom:0}
.hd2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:stretch}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.hint{font-size:12px;color:var(--text-sec)}
.empty{padding:32px 16px;text-align:center;color:var(--text-sec)}
.empty b{display:block;color:var(--text);font-size:15px;margin:8px 0 4px}
.lrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.lrow:last-child{border-bottom:0}
.lrow .m{flex:1;min-width:0}
.lrow .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .s{font-size:12px;color:var(--text-sec);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.due{text-align:right;flex:none;min-width:56px}
.due b{display:block;font:700 14px "JetBrains Mono",ui-monospace,monospace}
.due span{font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--text-sec)}
.c-red{color:var(--t-red)}.c-pink{color:var(--t-pink)}.c-green{color:var(--t-green)}.c-amber{color:var(--t-amber)}.c-purple{color:var(--t-purple)}.c-sec{color:var(--text-sec)}

/* --- 甘特 --- */
.gantt{--lw:220px;font-size:13px;margin-bottom:20px;position:relative}
.gr{display:flex;align-items:center;gap:12px;height:var(--rh,32px)}
.gl0{width:var(--lw);flex:none;min-width:0;display:flex;align-items:center;gap:6px}
.gl0 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-sec);font-size:13px}
.gt{flex:1;position:relative;height:100%}
.gh{height:22px}.gh .gt{color:var(--text-sec);font-size:12px}.gh .gt span{position:absolute;top:2px;white-space:nowrap}
.gv{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--border) 70%,transparent)}
.gbody{position:relative}
.gover{position:absolute;inset:0;display:flex;gap:12px;pointer-events:none}
.gt0{flex:1;position:relative}
.gtoday{position:absolute;top:0;bottom:0;border-left:2px dashed var(--acc-solid);opacity:.75}
.gtoday em{position:absolute;bottom:-20px;left:0;transform:translateX(-50%);font:600 11px inherit;font-style:normal;background:var(--acc-solid);color:var(--on-acc);border-radius:6px;padding:0 6px;white-space:nowrap}
.gb{position:absolute;top:50%;transform:translateY(-50%);height:var(--bh,14px);border-radius:7px;background:color-mix(in srgb,var(--c) 24%,transparent);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);overflow:hidden;min-width:6px}
.gp{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.9}
.gpct{position:absolute;top:50%;transform:translateY(-50%);font:600 12px "JetBrains Mono",ui-monospace,monospace;color:var(--text-sec);white-space:nowrap}
.gr.pj .gl0 .nm{color:var(--text);font-weight:600}
.gr.tk .gl0{padding-left:20px}
.gr:hover{background:color-mix(in srgb,var(--surface-hover) 55%,transparent)}
.grip{display:inline-flex;align-items:center;justify-content:center;width:20px;height:24px;color:var(--text-sec);cursor:grab;border-radius:4px;flex:none;user-select:none;background:none;border:0;padding:0}
.grip:hover{background:var(--surface-hover);color:var(--text)}
.grip:active{cursor:grabbing}
.tgl{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 4px;border-radius:6px;min-width:0;font-weight:600;color:var(--text)}
.tgl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pri{width:6px;height:6px;border-radius:50%;flex:none}

/* --- My Tasks --- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;min-height:84px}
.kpi .kpi-n{font-size:28px}
.kpi small{display:block;font-size:13px;color:var(--text-sec);margin-top:8px}
.mgrp{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.mgrp>h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:8px 16px;border-bottom:1px solid var(--border);min-height:40px}
.mgrp>h3 .cnt{margin-left:auto;font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--text-sec);font-weight:400}
.trw{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;min-height:48px;color:var(--text)}
.trw:last-child{border-bottom:0}
.trw:hover{background:var(--surface-hover)}
.trw .m{flex:1;min-width:0}
.trw .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trw .s{font-size:12px;color:var(--text-sec)}
.mini{width:72px;flex:none}
.mini .bar{height:5px}
.bar.xl{height:8px}
.runbar{position:relative;margin-top:30px}
.runner{position:absolute;bottom:4px;transform:translateX(-50%);line-height:0}
.dashed{border:1px dashed var(--border);border-radius:12px;background:var(--surface)}

/* --- Projects --- */
.ptool{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.ptool .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--c);box-shadow:var(--shadow-lg)}
.pcard .strip{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 0 8px;min-height:32px}
.pcard .body{padding:0 20px 12px}
.pcard .top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pcard .pname{background:none;border:0;padding:0;text-align:left;font-size:15px;font-weight:700;line-height:1.3;color:var(--text)}
.pcard .pname:hover{text-decoration:underline}
.pcard .meta{font-size:13px;color:var(--text-sec)}
.pcard .pct{font:700 14px "JetBrains Mono",ui-monospace,monospace}
.pcard .foot{display:flex;gap:8px;justify-content:flex-end;padding:8px 20px 12px;border-top:1px solid var(--border)}
.pcard.dimmed{opacity:.55}
.av{width:56px;height:56px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex:none;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);border:1px dashed color-mix(in srgb,var(--c) 55%,transparent);overflow:hidden}
.av.sm{width:32px;height:32px;border-radius:8px;font-size:15px}
.av.lg{width:72px;height:72px;border-radius:16px;font-size:30px;position:relative}
.av.cloud{background:var(--surface-light);border-style:solid}
.av .lt{color:var(--text)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:var(--shadow)}
.prow:hover{border-color:var(--c)}
.prow .nm{flex:1.2;min-width:0}.prow .nm button{background:none;border:0;padding:0;font-weight:600;text-align:left;color:var(--text)}
.prow .pb{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;background:color-mix(in srgb,var(--purple) var(--tint),transparent);color:var(--t-purple)}
.archh{display:flex;align-items:center;gap:8px;font-weight:700;margin:32px 0 8px}
.archh .hint{font-weight:400}
.pcard.arch{opacity:1;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;border-style:dashed;box-shadow:none}
.archgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.popover{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px}

/* --- 專案詳情 --- */
.dhead{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.dhead h2{font-size:24px;font-weight:700;line-height:1.2}
.dhead .meta{font-size:13px;color:var(--text-sec);margin-top:4px}
.dgrid{display:grid;grid-template-columns:264px 1fr;gap:16px;align-items:start}
.dside{display:flex;flex-direction:column;gap:12px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.mcard .lb{font-size:12px;color:var(--text-sec);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.mcard .big{font:700 32px "JetBrains Mono",ui-monospace,monospace;line-height:1}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tcard .h{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border)}
.tbar2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--border);background:var(--surface-light)}
.tbar2 .l{font-size:12px;color:var(--text-sec);margin-left:6px}
.trow{border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:0}
.trm{display:flex;align-items:center;gap:8px;padding:8px 20px 8px 12px;min-height:56px;cursor:pointer;position:relative}
.trm:hover{background:var(--surface-hover)}
.trm .tn{flex:1;min-width:0}
.trm .tnm{font-weight:500;background:none;border:0;padding:0;text-align:left;color:var(--text);display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trm .tnm:hover{text-decoration:underline}
.trm .ln{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px;font-size:12px;color:var(--text-sec)}
.trm .pgs{width:96px;flex:none}
.trm .pgs small{display:block;font:11px "JetBrains Mono",ui-monospace,monospace;color:var(--text-sec);text-align:right;margin-top:2px}
.exp{background:none;border:0;padding:2px;border-radius:6px;color:var(--text-sec);display:inline-flex}
.exp:hover{background:var(--surface-hover);color:var(--text)}
.subs{padding:0 20px 8px 56px}
.sub{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;min-height:32px}
.sub:hover{background:var(--surface-hover)}
.sub .nm{flex:1.2;min-width:0;font-size:13px;color:var(--text-sec)}
.sub .nm.done{text-decoration:line-through;opacity:.7}
.sub .nt{flex:1;min-width:0;font-size:12px;color:var(--text-sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--text-sec);background:transparent;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;padding:0}
.cb[aria-checked="true"]{background:var(--green);border-color:var(--green)}
[data-theme="light"] .cb[aria-checked="true"]{background:var(--t-green);border-color:var(--t-green)}
[data-theme="dark"] .cb[aria-checked="true"]{color:#0E1620}
.addsub{background:none;border:0;color:var(--t-accent);font-size:13px;padding:2px 8px;border-radius:6px}
.addsub:hover{background:var(--surface-hover)}
.pop{position:absolute;right:8px;top:100%;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px 0;min-width:140px}
.pop button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 12px;text-align:left}
.pop button:hover{background:var(--surface-hover)}

/* --- 彈窗 --- */
.ovl{position:fixed;inset:0;z-index:400;background:rgba(10,14,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
.mdl{width:640px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.mdl .mh{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.mdl .mb2{padding:20px;display:flex;flex-direction:column;gap:16px}
.mdl .mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.mdl label,.mdl .lb2{display:block;font-size:12px;color:var(--text-sec);margin-bottom:4px}
.mdl .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mdl .fld,.mdl select.fld{width:100%}
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:32px}
.tags select{width:auto;max-width:160px}
.sec2{border-top:1px solid var(--border);padding-top:12px}
.tip{display:flex;gap:8px;align-items:center;margin-top:8px;padding:6px 12px;border-radius:10px;background:color-mix(in srgb,var(--pink) var(--tint),transparent);font-size:12px;color:var(--text)}
.item{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;background:var(--surface-light);margin-bottom:4px;font-size:13px}
.item a{flex:1;color:var(--t-accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span.f{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-sec)}

/* --- Data（無雲、高密度）--- */
.dtool{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{background:var(--surface-light);text-align:left;font-weight:600;color:var(--text-sec);padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
table.dt th button{background:none;border:0;padding:0;font-weight:600;color:var(--text-sec);display:inline-flex;gap:4px;align-items:center}
table.dt td{padding:4px 8px;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);height:34px;vertical-align:middle}
table.dt tr:hover td{background:var(--surface-hover)}
table.dt tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
table.dt tr.subr td{background:var(--surface-light);height:28px;font-size:12px;color:var(--text-sec)}
table.dt td.nw{white-space:nowrap}
table.dt td .cut{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pager{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--text-sec)}

.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.setrow:last-child{border-bottom:0}
.setrow b{font-weight:600;display:block}
.setrow small{display:block;color:var(--text-sec);font-size:12px;margin-top:2px;max-width:340px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.g4 label,.sgrid label.l{font-size:11px;color:var(--text-sec);display:block;margin-bottom:2px}
.sgrid h4{font-size:13px;font-weight:600;color:var(--text-sec);margin:12px 0 6px}

/* --- 狀態集／toast／登入 --- */
.sgal{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.scard h3{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{border:1px solid var(--border);border-radius:12px;padding:8px;background:var(--bg)}
.pane>i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--text-sec);margin:0 0 4px 4px}
.emp{border:1px dashed var(--border);border-radius:12px;background:var(--surface);padding:16px 12px;text-align:center;font-size:13px;color:var(--text-sec);min-height:176px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.emp b{color:var(--text);font-size:15px;margin-top:4px}
.emp .btn{margin-top:8px}
.emp.err b{color:var(--t-red)}
.toast{display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:8px 20px 8px 12px;box-shadow:var(--shadow-lg);overflow:hidden;width:max-content;max-width:100%}
.toast b{display:block;font-size:14px}.toast div div{font-size:13px;color:var(--text-sec)}

.login{min-height:720px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:24px}
.five{display:flex;gap:16px;align-items:flex-end;justify-content:center;min-height:112px}
.lcard{width:400px;padding:24px;display:flex;flex-direction:column;gap:16px}
.lcard .fld{width:100%;padding:8px 12px}
.lcard label{font-size:12px;color:var(--text-sec);display:block;margin-bottom:4px}
.lh{text-align:center}.lh h1{font-size:24px;font-weight:700}.lh p{color:var(--text-sec);margin:4px 0 0}
.bigp{display:none;width:56px;height:56px;line-height:56px;border-radius:50%;background:var(--acc-solid);color:var(--on-acc);font:700 28px inherit;text-align:center}
[data-clouds="off"] .login .bigp{display:block}
.sep{display:block;height:1px;background:var(--border);margin:8px 0}

function axis(min, max, mode) {
  const a = D(min), b = D(max), tot = b - a, out = [];
  if (mode === '月' || mode === '季') {
    let c = new Date(a.getFullYear(), a.getMonth(), 1); if (c < a) c = new Date(c.getFullYear(), c.getMonth() + 1, 1);
    for (; c <= b; c = new Date(c.getFullYear(), c.getMonth() + 1, 1)) {
      const m = c.getMonth();
      if (mode === '季' && m % 3) continue;
      out.push({ p: (c - a) / tot * 100, l: mode === '季' ? `${m === 0 ? c.getFullYear() + ' ' : ''}Q${m / 3 + 1}` : `${m === 0 ? c.getFullYear() + ' ' : ''}${m + 1}月` });
    }
  } else { for (let c = new Date(a); c <= b; c = new Date(c.getTime() + 14 * 864e5)) out.push({ p: (c - a) / tot * 100, l: `${c.getMonth() + 1}/${c.getDate()}` }); }
  return out;
}
function gantt(rows, o) {
  const a = D(o.min), b = D(o.max), tot = b - a, tk = axis(o.min, o.max, o.mode || S.timeDim);
  const pc = d => Math.max(0, Math.min(100, (D(d) - a) / tot * 100));
  const lines = tk.map(t => `<i class="gv" style="left:${t.p}%"></i>`).join('');
  const body = rows.map(r => {
    let bar = '';
    if (r.bar) {
      const L = pc(r.bar.s), W = Math.max(0.8, pc(r.bar.e) - L + 100 / (tot / 864e5));
      const Wc = Math.min(W, 100 - L), inside = L + Wc > 90;
      bar = `<span class="gb" style="left:${L}%;width:${Wc}%;--c:var(--${r.bar.c});--bh:${r.bar.h || 14}px" title="${esc(r.bar.tip || '')}"><span class="gp" style="width:${r.bar.p}%"></span></span>` +
        (r.bar.p > 0 && r.bar.p < 100 ? `<span class="gpct" style="${inside ? `right:calc(${100 - L}% + 6px)` : `left:calc(${L + Wc}% + 6px)`}">${r.bar.p}%</span>` : r.bar.p === 100 ? `<span class="gpct c-green" style="${inside ? `right:calc(${100 - L}% + 6px)` : `left:calc(${L + Wc}% + 6px)`}">100%</span>` : '');
    }
    return `<div class="gr ${r.cls || ''}" ${r.tid ? `data-tid="${r.tid}"` : ''} style="--rh:${o.rh || 32}px"><div class="gl0">${r.label}</div><div class="gt">${lines}${bar}</div></div>`;
  }).join('');
  return `<div class="gantt" style="--lw:${o.lw || 220}px"><div class="gr gh"><div class="gl0"></div><div class="gt">${tk.map(t => `<span style="left:${t.p}%">${t.l}</span>`).join('')}</div></div>
  <div class="gbody">${body}<div class="gover"><div class="gl0"></div><div class="gt0"><i class="gtoday" style="left:${pc(TODAY)}%"><em>今天</em></i></div></div></div></div>`;
}

function myData() {
  const me = S.my.demo === 'none' ? '新同事' : ME, sel = S.my.demo === 'filtered' && !S.my.sel.length ? ['暫緩'] : S.my.sel;
  const mine = TASKS.filter(t => ownerAll(t).includes(me)), g = { overdue: [], soon: [], later: [] };
  const wantDone = sel.includes('已完成'); if (wantDone) g.done = [];
  for (const t of mine) {

    const d = dayDiff(t.e, TODAY); (d < 0 ? g.overdue : d <= 7 ? g.soon : g.later).push(t);
  }
  for (const k in g) g[k].sort((a, b) => k === 'done' ? D(b.e) - D(a.e) : D(a.e) - D(b.e));
  const base = { overdue: 0, soon: 0, later: 0 }; mine.forEach(t => { if (t.st !== '已完成') { const d = dayDiff(t.e, TODAY); d < 0 ? base.overdue++ : d <= 7 ? base.soon++ : base.later++; } });

/* ---- Timeline ---- */
V.timeline = () => {
  const vis = PROJECTS.filter(p => !p.arch && !p.hide && (!S.fp.length || S.fp.includes(p.id)));
  const ordered2 = S.tl.sort === 'name' ? [...vis].sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant')) : S.tl.sort === 'progress' ? [...vis].sort((a, b) => projAvg(b.id) - projAvg(a.id)) : vis;
  const allCol = ordered2.length > 0 && ordered2.every(p => S.tl.collapsed.includes(p.id));
  const rows = [];
  ordered2.forEach(p => {
    const r = projRange(p.id), od = projTasks(p.id).filter(overdue).length, col = S.tl.collapsed.includes(p.id);
    rows.push({ cls: 'pj', label: `<button type="button" class="tgl" data-act="tltog" data-a="${p.id}" aria-expanded="${!col}" aria-label="${col ? '展開' : '收折'}「${esc(p.name)}」">${ic(col ? 'chev-r' : 'chev-d', 14)}<span class="pdot" style="--c:var(--${p.c})"></span><span class="nm">${esc(p.name)}</span></button>${od ? `<span style="display:inline-flex;align-items:center;gap:2px;margin-left:2px">${cl('dark', 24, { fb: 'dot' })}<span class="hint c-red" style="font-weight:600;white-space:nowrap">${od} 逾期</span></span>` : ''}`, bar: { s: r.s, e: r.e, c: p.c, p: projAvg(p.id), h: 12, tip: `${p.name} ${r.s} → ${r.e}` } });
    if (!col) projTasks(p.id).filter(t => (!S.fs.length || S.fs.includes(t.st)) && (S.fpr === '全部' || t.pri === S.fpr)).sort((a, b) => D(a.s) - D(b.s)).forEach(t => rows.push({ cls: 'tk', label: `<span class="pri" style="background:var(--${t.pri === '高' ? 'red' : t.pri === '中' ? 'amber' : 'text-sec'})"></span><span class="nm" title="${esc(t.name)}">${esc(t.name)}</span>`, bar: { s: t.s, e: t.e, c: SVAR[t.st][0], p: prog(t), h: 12, tip: `${t.name} ${t.s} → ${t.e} ${t.st}` } }));
  });
  const hidden = PROJECTS.filter(p => p.arch).length, eye = PROJECTS.filter(p => p.hide).length;
  return shell('timeline', `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap"><div style="display:flex;gap:8px;align-items:center"><label class="sr" for="tlsort">排序方式</label><select id="tlsort" class="sel" data-chg="tlsort"><option value="manual"${S.tl.sort === 'manual' ? ' selected' : ''}>手動</option><option value="name"${S.tl.sort === 'name' ? ' selected' : ''}>名稱</option><option value="progress"${S.tl.sort === 'progress' ? ' selected' : ''}>進度</option></select>
  <button type="button" class="btn sec" data-act="tlall">${allCol ? '全部展開' : '全部收折'}</button><span class="hint">不顯示：已封存 ${hidden} 個${eye ? `、已隱藏 ${eye} 個` : ''}（可在 Projects 的眼睛切換）</span></div>${scaleSeg()}</div>
  <section class="blk" style="padding:16px 20px 28px" aria-label="Timeline">${rows.length ? gantt(rows, { min: '2026/06/01', max: '2027/02/15', rh: 34, lw: 280 }) : `<div class="empty">${cl('purple', 64, { fb: 'none' })}<b>沒有可顯示的專案</b>調整上方的專案篩選</div>`}</section>`, { fbar: true });
};

/* ---- Data ---- */
V.data = () => {
  const { sort, dir, page, sel, exp } = S.dt;
  let rows = TASKS.filter(t => (!S.fs.length || S.fs.includes(t.st)) && (S.fpr === '全部' || t.pri === S.fpr) && (!S.fp.length || S.fp.includes(t.p)));
  const key = { project: t => PROJECTS.findIndex(p => p.id === t.p), task: t => t.name, owner: t => ownerAll(t)[0] || '', status: t => STATUSES.indexOf(t.st), priority: t => PORD[t.pri], progress: t => prog(t), category: t => t.cat, start: t => t.s, end: t => t.e, creator: t => t.by }[sort];
  rows = rows.map((t, i) => [t, i]).sort(([a, ai], [b, bi]) => { const ka = key(a), kb = key(b); return (ka < kb ? -1 : ka > kb ? 1 : ai - bi) * dir; }).map(x => x[0]);
  const per = 30, pages = Math.max(1, Math.ceil(rows.length / per)), pg = Math.min(page, pages), view = rows.slice((pg - 1) * per, pg * per);
  const cols = [['project', 'Project'], ['task', 'Task'], ['owner', 'Owner'], ['status', 'Status'], ['priority', 'Pri'], ['progress', 'Progress'], ['category', 'Category'], ['start', 'Start'], ['end', 'End'], ['notes', 'Notes'], ['creator', 'Creator']];
  const th = ([k, l]) => k === 'notes' ? `<th scope="col">${l}</th>` : `<th scope="col" aria-sort="${sort === k ? (dir === 1 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-act="dsort" data-a="${k}">${l}${sort === k ? (dir === 1 ? ' ↑' : ' ↓') : ''}</button></th>`;
  const out = view.map(t => {
    const p = prog(t), open = !!exp[t.id], isSel = sel.includes(t.id);
    const r = `<tr class="${isSel ? 'sel' : ''}"><td style="text-align:center"><input type="checkbox" data-chg="dtsel" data-a="${t.id}"${isSel ? ' checked' : ''} aria-label="選取「${esc(t.name)}」"></td>

    <td><span style="display:inline-flex;align-items:center;gap:4px">${t.subs.length ? `<button type="button" class="exp" data-act="dtexp" data-a="${t.id}" aria-expanded="${open}" aria-label="${open ? '收合' : '展開'}子任務">${ic(open ? 'chev-d' : 'chev-r', 14)}</button>` : '<span style="width:18px"></span>'}<button type="button" class="tnm" style="background:none;border:0;padding:0;color:var(--text);font-weight:500;text-align:left" data-act="modal" data-a="${t.id}">${esc(t.name)}</button>${t.subs.length ? `<span class="hint mono">${t.subs.filter(s => s.d).length}/${t.subs.length}</span>` : ''}</span></td>
    <td>${ownerChips(t)}</td><td>${stp(t.st)}</td><td class="nw" style="font-weight:600;color:var(--${t.pri === '高' ? 't-red' : t.pri === '中' ? 't-amber' : 'text-sec'})">${t.pri}</td>
    <td style="min-width:104px"><div style="display:flex;align-items:center;gap:6px"><div class="mini" style="width:56px">${bar(p, p === 100 ? 'green' : 'accent')}</div><span class="mono" style="font-size:12px;width:32px;text-align:right">${p}%</span></div></td>
    <td class="nw">${t.cat}</td><td class="nw mono">${t.s}</td><td class="nw mono">${t.e}</td><td><span class="cut sec" style="max-width:120px">${esc(t.note) || '—'}</span></td><td class="nw">${esc(t.by)}</td></tr>`;
    return r + (open ? t.subs.map(s => `<tr class="subr"><td></td><td></td><td colspan="2" style="padding-left:40px">${s.d ? '☑' : '☐'} ${esc(s.n)}</td><td>${s.o ? pp(s.o) : ''}</td><td colspan="6" class="sec">${esc(s.nt)}</td></tr>`).join('') : '');
  }).join('');
  return shell('data', `<div class="card" style="overflow:hidden"><div class="dtool"><span class="sec" style="font-size:13px">點選儲存格選取 · 雙擊或 F2 編輯 · 方向鍵移動（示意）</span><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
  ${sel.length ? `<select class="sel" data-chg="dtassign" aria-label="指派 Owner"><option value="">指派 Owner (${sel.length})</option>${PEOPLE.map(n => `<option>${n}</option>`).join('')}</select><button type="button" class="btn danger sm" data-act="dtdel">刪除已選 (${sel.length})</button>` : ''}
  <button type="button" class="btn sec sm" data-act="noop">Export CSV</button><button type="button" class="btn sec sm" data-act="noop">Import CSV</button><button type="button" class="btn sec sm" data-act="noop">Import URL</button><button type="button" class="btn sm" data-act="noop">+ Create</button></div></div>
  <div class="tw"><table class="dt"><thead><tr><th style="width:36px;text-align:center"><input type="checkbox" data-chg="dtall" aria-label="全選本頁"${view.length && view.every(t => sel.includes(t.id)) ? ' checked' : ''}></th>${cols.map(th).join('')}</tr></thead><tbody>${out || '<tr><td colspan="12" class="empty">No tasks found — 調整上方的跨專案篩選</td></tr>'}</tbody></table></div>
  <div class="pager"><span>每頁 ${per} 筆 · 共 ${rows.length} 筆</span><span style="display:flex;align-items:center;gap:8px"><button type="button" class="btn sec sm" data-act="dpg" data-a="-1"${pg <= 1 ? ' disabled' : ''}>上一頁</button><span class="mono">${pg} / ${pages}</span><button type="button" class="btn sec sm" data-act="dpg" data-a="1"${pg >= pages ? ' disabled' : ''}>下一頁</button></span></div></div>`, { fbar: true });
};

  const q = new URLSearchParams(location.search); // 深連結：?theme=dark&clouds=off#mytasks

  if (q.get('clouds') === 'off') { S.clouds = false; document.documentElement.setAttribute('data-clouds', 'off'); }
  const h = (location.hash || '').slice(1);
  show(SCREENS.some(s => s[0] === h) ? h : 'login');
}
function moveTask(id, dir) {
  const o = ordered(S.sel).map(t => t.id), i = o.indexOf(id), j = i + dir; if (j < 0 || j >= o.length) return;
  o.splice(j, 0, o.splice(i, 1)[0]); S.order[S.sel] = o; S.d.sort = 'manual'; render();
}
document.addEventListener('DOMContentLoaded', init);
window.__proto = { S, show, render };
})();
</script>
