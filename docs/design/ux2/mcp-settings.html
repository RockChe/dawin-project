<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>大雲文創專案管理系統 · 設定 › 遠端 MCP · UIUX 設計稿（1280）</title>
<link rel="stylesheet" href="ux.css">
<style>
/* ===== 本檔補充（共用 token 在 ux.css）。文字色一律用 --t-*（AA 版）；Settings 頁不放雲，圖示全是 inline SVG ===== */
:root,[data-theme="light"]{
  --acc-solid:var(--accent-dark);--on-acc:#fff;--focus:#1F7AA6;--frame:#E4E0D8;
  --t-red:color-mix(in srgb,var(--red) 68%,#000);--t-amber:color-mix(in srgb,var(--amber) 55%,#000);
  --t-green:color-mix(in srgb,var(--green) 58%,#000);--t-accent:color-mix(in srgb,var(--accent) 70%,#000);
}
[data-theme="dark"]{
  --acc-solid:var(--accent);--on-acc:#0E1620;--focus:#7CCBE6;--frame:#0F1218;--text-sec:#9CA7B6;
  --t-red:color-mix(in srgb,var(--red) 72%,#fff);--t-amber:color-mix(in srgb,var(--amber) 72%,#fff);
  --t-green:color-mix(in srgb,var(--green) 72%,#fff);--t-accent:color-mix(in srgb,var(--accent) 72%,#fff);
}
body{background:var(--frame);min-width:1280px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.ic{flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
code,.mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}

/* --- 設計稿工具列（畫布外，固定深色）--- */
.tb{position:sticky;top:0;z-index:300;background:#18202B;color:#E8EDF3;font:13px/1.4 "Noto Sans TC",system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tb .r1,.tb .r2{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.tb .r2{border-top:1px solid #2B3646;padding:6px 16px;color:#B8C4D3}
.tb b{color:#fff}.tb .lab{color:#9FB0C4}.tb .sp{flex:1}
.tb button,.tb a.jl{background:transparent;border:1px solid #3C4A5E;color:#E8EDF3;border-radius:8px;padding:3px 10px;font-size:13px;text-decoration:none}
.tb button:hover,.tb a.jl:hover{background:#263243}
.tb button[aria-pressed="true"]{background:#7CCBE6;border-color:#7CCBE6;color:#0E1620;font-weight:700}
.tb :focus-visible{outline-color:#B5E4F3}
.tb .grp{display:flex;gap:4px}
.tb .sep{width:1px;height:18px;background:#3C4A5E;margin:0 4px}

/* --- 畫布 --- */
#canvas{position:relative;width:1280px;margin:16px auto 32px;background:var(--bg);box-shadow:0 8px 40px rgba(0,0,0,.18);border-radius:4px;overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}
.logo{width:32px;height:32px;line-height:32px;border-radius:50%;background:var(--acc-solid);color:var(--on-acc);font-weight:700;font-size:17px;text-align:center}
.hr{display:flex;align-items:center;gap:12px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:10px;color:var(--text-sec)}
.search input{width:220px;padding:6px 12px 6px 32px;border-radius:99px;border:1px solid var(--border);background:var(--surface-light);outline:none}
.search input::placeholder{color:var(--text-sec)}
.icbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text-sec);padding:0}
.icbtn:hover{background:var(--surface-hover)}
.vd{width:1px;height:28px;background:var(--border)}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.wrap{padding:16px 24px 48px}
.tabs{margin-bottom:12px}
.tabs .t{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 20px;margin-bottom:-1px}
.tabs .t:hover{color:var(--text)}
.tabs .t.on{color:var(--t-accent);border-bottom-color:var(--acc-solid);font-weight:700}
.crumbs{margin:0 0 16px;font-size:13px;color:var(--text-sec)}
.crumbs .lnk{background:none;border:0;padding:0;color:var(--t-accent);text-decoration:underline;text-underline-offset:2px}
.crumbs b{color:var(--text)}
.setlay{display:grid;grid-template-columns:168px 1fr;gap:24px;align-items:start}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;padding:8px 12px;color:var(--text-sec)}
.snav button:hover{background:var(--surface-hover);color:var(--text)}
.snav button[aria-current="page"]{border-left-color:var(--acc-solid);background:color-mix(in srgb,var(--accent) var(--tint),transparent);color:var(--t-accent);font-weight:700}
.page{display:flex;flex-direction:column;gap:16px;min-width:0}

/* --- 元件 --- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc-solid);background:var(--acc-solid);color:var(--on-acc);border-radius:99px;padding:4px 16px;min-height:32px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--t-accent)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--t-red)}
.btn.dangerf{background:var(--ink-red);border-color:var(--ink-red);color:#fff}
[data-theme="dark"] .btn.dangerf{color:#1A1E26}
.btn.sec{background:var(--surface);border-color:var(--border);color:var(--text-sec)}
.btn.sec:hover{background:var(--surface-hover)}
.btn.sm{min-height:26px;padding:1px 12px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.chip{min-height:28px;font-size:12px;padding:1px 12px;color:var(--text-sec)}
.chip:hover{background:var(--surface-hover)}
.chip[aria-pressed="true"]{background:var(--acc-solid);border-color:var(--acc-solid);color:var(--on-acc);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden;background:var(--surface-light)}
.seg button{border:0;background:transparent;padding:3px 12px;font-size:13px;color:var(--text-sec)}
.seg button[aria-pressed="true"]{background:var(--acc-solid);color:var(--on-acc);font-weight:700}
.fld,.sel{background:var(--surface-light);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-height:32px;max-width:100%}
.fld[aria-invalid="true"]{border-color:var(--red)}
.sel{background:var(--surface)}
.sw{position:relative;width:40px;height:22px;border-radius:99px;border:1px solid var(--border);background:var(--surface-hover);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:left .15s}
.sw[aria-checked="true"]{background:var(--acc-solid);border-color:var(--acc-solid)}
.sw[aria-checked="true"]::after{left:20px}
.sw.danger[aria-checked="true"]{background:var(--ink-red);border-color:var(--ink-red)}
.sw[disabled]{opacity:.5;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
.pl{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pl.ok{color:var(--t-green);background:color-mix(in srgb,var(--green) var(--tint),transparent)}
.pl.soon,.pl.warn{color:var(--t-amber);background:color-mix(in srgb,var(--amber) var(--tint),transparent)}
.pl.exp,.pl.bad{color:var(--t-red);background:color-mix(in srgb,var(--red) var(--tint),transparent)}
.pl.rev,.pl.gray{color:var(--text-sec);background:color-mix(in srgb,var(--text-dim) var(--tint),transparent)}
.pl.rd{color:var(--t-accent);background:color-mix(in srgb,var(--accent) var(--tint),transparent)}
.pl.big{font-size:13px;padding:3px 12px;border-radius:99px}
.badge{font-size:11px;border-radius:6px;padding:0 6px;margin-left:6px;background:color-mix(in srgb,var(--accent) var(--tint),transparent);color:var(--t-accent);font-weight:600;white-space:nowrap}
.dim{color:var(--text-dim)}.sec{color:var(--text-sec)}
.hint{font-size:12px;color:var(--text-sec)}

.blk{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.hd2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:0}
.tbar{display:inline-block;width:3px;height:14px;border-radius:2px;background:var(--c,var(--accent))}
.pagehd h2{font-size:24px;font-weight:700}
.pagehd p{margin:4px 0 0;color:var(--text-sec);max-width:720px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 14px;font-size:13px;border:1px solid var(--border)}
.note .ic{margin-top:2px}
.note.amber{background:color-mix(in srgb,var(--amber) 14%,var(--surface));border-color:color-mix(in srgb,var(--amber) 55%,var(--surface));color:var(--text)}
.note.amber .ic{color:var(--t-amber)}
.note.red{background:color-mix(in srgb,var(--red) 12%,var(--surface));border-color:color-mix(in srgb,var(--red) 55%,var(--surface));color:var(--text)}
.note.red .ic{color:var(--t-red)}
.note.info{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 40%,var(--surface))}
.note.info .ic{color:var(--t-accent)}
.note b{font-weight:700}
.draft{border-style:dashed}
.shake{animation:shake .3s 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none;outline:2px solid var(--red)}}
.adminhd{display:flex;align-items:center;gap:8px;margin:8px 0 -4px;font-weight:700;color:var(--t-accent);border-top:2px dashed var(--border);padding-top:16px}
.adminhd span{font-weight:400;color:var(--text-sec);font-size:12px}

/* 連線資訊 */
.cgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:24px}
.lab2{font-size:12px;font-weight:600;color:var(--text-sec);margin:0 0 4px;display:block}
.cline{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.cbox{flex:1;min-width:0;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;overflow:auto;white-space:nowrap}
.tbox{background:var(--surface-light);border:1px solid var(--border);border-radius:10px;padding:12px}
.tsteps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.tsteps li{display:flex;gap:8px;align-items:flex-start}
.tsteps .mk{width:18px;height:18px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;margin-top:1px;border:1px solid var(--border);color:var(--text-sec);font-size:10px}
.tsteps .okk .mk{background:var(--ink-green);border-color:var(--ink-green);color:#fff}
[data-theme="dark"] .tsteps .okk .mk{color:#1A1E26}
.tsteps .bad .mk{background:var(--ink-red);border-color:var(--ink-red);color:#fff}
[data-theme="dark"] .tsteps .bad .mk{color:#1A1E26}
.tsteps .skip{color:var(--text-sec)}
.tsteps .msg{display:block;font-size:12px;color:var(--text-sec)}
.tsteps .bad .msg{color:var(--t-red)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{font-size:12px;border:1px solid var(--border);border-radius:99px;padding:0 10px;background:var(--surface-light);display:inline-flex;gap:4px;align-items:center}
.tchip.w{border-style:dashed}
.tchip.off{color:var(--text-sec);opacity:.9}
.tchip.off code{text-decoration:line-through}
.tchip.off em{font-style:normal}
/* 表格 */
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{text-align:left;font-size:12px;font-weight:600;color:var(--text-sec);padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.dt td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);vertical-align:middle;min-height:36px}
table.dt tr:hover td{background:var(--surface-hover)}
table.dt td.nw{white-space:nowrap}
table.dt td .cut{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
table.dt tr.flash td{background:color-mix(in srgb,var(--amber) 22%,transparent)}
table.dt tr.off td{color:var(--text-sec)}
.tw{overflow-x:auto}
.cnt{font:700 14px "JetBrains Mono",ui-monospace,monospace}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.frow .lab{font-size:12px;color:var(--text-sec)}
.empty{padding:28px 16px;text-align:center;color:var(--text-sec);border:1px dashed var(--border);border-radius:10px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
/* 教學 */
.tl{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tl [role="tab"]{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 16px;color:var(--text-sec)}
.tl [role="tab"][aria-selected="true"]{color:var(--t-accent);font-weight:700;border-bottom-color:var(--acc-solid)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps>li{counter-increment:s;position:relative;padding-left:34px}
.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--acc-solid);color:var(--on-acc);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.steps b{display:block;font-weight:600;margin-bottom:2px}
pre.code{margin:6px 0 0;background:var(--surface-light);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;white-space:pre-wrap;word-break:break-all;flex:1;min-width:0}
.cpl{display:flex;gap:8px;align-items:flex-start}
/* 安全 */
.safe ul{margin:6px 0 0;padding-left:20px}.safe li{margin:3px 0}
/* 緊急開關 */
.kill{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid var(--border)}
.kill:last-child{border-bottom:0}
.kill b{font-size:15px;display:block}.kill small{display:block;color:var(--text-sec);font-size:12px;margin-top:2px;max-width:600px}
.kill.big b{font-size:17px}
.sw.big{width:56px;height:30px}.sw.big::after{width:24px;height:24px}.sw.big[aria-checked="true"]::after{left:28px}
/* 矩陣 */
.grp td{background:var(--surface-light);font-weight:700;font-size:12px;color:var(--text-sec)}
td.c,th.c{text-align:center}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--acc-solid);vertical-align:middle}
.spark{display:block}
.pp2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:10px;padding:4px 10px;font-size:12px;background:var(--surface-light)}
.ppl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.ppl .pr{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:13px}
.ppl .pr small{display:block;color:var(--text-sec);font-size:11px}
/* 對話框 */
.mback{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:560px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.dlg>header{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dlg h2{font-size:17px}
.dlg .bd{padding:4px 20px 12px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg>footer{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border)}
.iconx{background:none;border:0;color:var(--text-sec);padding:4px;border-radius:6px;line-height:0}
.iconx:hover{background:var(--surface-hover);color:var(--text)}
.fg label.l,.fg legend{font-size:13px;font-weight:600;display:block;margin:0 0 4px;padding:0}
.fg{border:0;padding:0;margin:0;min-width:0}
.fg .fld,.fg .sel{width:100%}
.rad{display:flex;gap:8px}
.rad label{flex:1;border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;background:var(--surface-light)}
.rad label.on{border-color:var(--acc-solid);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.rad label.dis{opacity:.6;cursor:not-allowed}
.rad small{display:block;color:var(--text-sec);font-size:12px}
.err{color:var(--t-red);font-size:12px}
details.adv{border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface-light)}
details.adv summary{cursor:pointer;font-weight:600;font-size:13px}
.trow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;position:relative}
.trow code{font-size:12px}
.trow .tg{margin-left:auto;font-size:11px;color:var(--text-sec)}
.trow.dis{color:var(--text-sec)}
.trow.dd{border-top:1px dashed var(--border);margin-top:4px;padding-top:8px;outline-offset:2px}
.trow .tip{position:absolute;left:24px;top:100%;z-index:5;background:var(--text);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;width:340px;display:none}
.trow.dd:hover .tip,.trow.dd:focus .tip{display:block}
.tgrp{font-size:12px;font-weight:700;color:var(--text-sec);margin:6px 0 0}
.keybox{display:flex;gap:8px;align-items:center;border:2px solid var(--acc-solid);border-radius:10px;padding:10px 12px;background:var(--surface-light)}
.keybox code{flex:1;min-width:0;word-break:break-all;font-size:14px;user-select:all}
.ck{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
/* toast */
#toastHost{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:8px 18px;box-shadow:var(--shadow-lg);font-size:13px}

/* --- 回應式預覽 + 狀態集（畫布外）--- */
.outer{width:1280px;margin:0 auto 32px;padding:0 0 8px}
.outer>h2{font-size:18px;color:var(--text);margin:0 0 4px}
.outer>p.lead{margin:0 0 12px;color:var(--text-sec);max-width:860px}
.rgrid{display:grid;grid-template-columns:1fr 430px;gap:24px;align-items:start}
.tabfr{border:2px solid var(--border);border-radius:16px;background:var(--bg);padding:10px;width:100%;aspect-ratio:4/3;max-height:380px;display:flex;flex-direction:column;gap:6px}
.tabfr .tt{display:flex;gap:4px;font-size:10px;color:var(--text-sec);border-bottom:1px solid var(--border);padding-bottom:4px}
.tabfr .tt span.on{color:var(--t-accent);font-weight:700}
.tabfr .mid{display:grid;grid-template-columns:58px 1fr 1fr;gap:6px;flex:1;min-height:0}
.tabfr .sn{font-size:9px;display:flex;flex-direction:column;gap:4px;color:var(--text-sec)}
.tabfr .sn b{color:var(--t-accent);border-left:2px solid var(--acc-solid);padding-left:4px}
.tabfr .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.tb2{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px;font-size:10px;font-weight:700;display:flex;flex-direction:column;gap:4px;flex:1}
.tb2 i{display:block;height:5px;border-radius:3px;background:var(--surface-hover)}.tb2 i:nth-child(3){width:70%}.tb2 i:nth-child(4){width:50%}
.tabfr .adm{border:1px dashed var(--border);border-radius:8px;padding:5px 8px;font-size:10px;color:var(--text-sec)}
.phone{width:390px;height:760px;border:10px solid #222a35;border-radius:36px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);margin:0 auto}
.phone .pbody{flex:1;overflow:auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:12px}
.phone .ptop{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}

<script src="clouds.js"></script>
<script>
'use strict';
/* ================= 資料 ================= */
const URL_MCP = 'https://dawin-dash.example.app/api/mcp';
const HDR = 'Authorization: Bearer <你的金鑰>';
const CC_CMD = `claude mcp add --transport http dawin-dash ${URL_MCP} --header "Authorization: Bearer <你的金鑰>"`;
const JSON_CFG = `{\n  "mcpServers": {\n    "dawin-dash": {\n      "type": "http",\n      "url": "${URL_MCP}",\n      "headers": { "Authorization": "Bearer <你的金鑰>" }\n    }\n  }\n}`;
const TODAY = '2026-10-07';
const USERS = { rock: { n: 'Rock', role: 'admin' }, xz: { n: '幸真', role: 'member' }, fe: { n: 'Felien 車', role: 'member' }, ka: { n: 'Karen', role: 'member' }, ra: { n: 'Rae', role: 'member' }, ol: { n: 'Oliver', role: 'viewer' } };
const ME = { member: 'xz', viewer: 'ol', admin: 'rock' };
const ROLE_LABEL = { member: '一般成員', viewer: '唯讀成員', admin: '管理員' };
const READ = [['list_projects', '專案清單'], ['get_project', '專案詳情（含任務與子任務）'], ['search_tasks', '依狀態、負責人、專案、到期日搜尋'], ['get_task', '單一任務詳情'], ['my_tasks', '我關注／我執行的任務'], ['list_people', '人名清單（不含個資）']];
const WRITE = [['create_task', '建立任務'], ['update_task', '修改任務（狀態、日期、優先度、備註、關注人）'], ['create_subtask', '建立子任務'], ['update_subtask', '改名、執行人、備註'], ['set_subtask_done', '設定子任務完成與否（不做 toggle）'], ['create_project', '建立專案'], ['rename_project', '專案改名']];
const WNAMES = WRITE.map(t => t[0]);
const PROJ = ['春季檔期官網改版', '品牌形象短片', 'Q4 展覽攤位', '社群月報', '客戶提案簡報'];
const TASK = ['T-112 首頁橫幅文案', 'T-087 拍攝腳本定稿', 'T-203 攤位報價確認', 'T-156 九月成效週報', 'T-241 提案封面設計'];

const dnum = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
const daysTo = s => dnum(s) - dnum(TODAY);
const addDays = (s, n) => new Date((dnum(s) + n) * 864e5).toISOString().slice(0, 10);
const md = s => s.slice(5).replace('-', '/');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

const K = (id, owner, name, prefix, scope, created, last, exp, revoked) => ({ id, owner, name, prefix, scope, created, last, exp, revoked: revoked || null });
const initKeys = () => [
  K('r1', 'rock', 'Rock 筆電 Claude Code', 'dd_live_ab12cd34…', 'w', '2026-08-12', '2026-10-07 09:41', '2026-11-10'),
  K('r2', 'rock', '桌面版 Claude', 'dd_live_7fe0a91c…', 'w', '2026-07-20', '2026-10-06 18:12', '2026-10-18'),
  K('r3', 'rock', '舊測試金鑰', 'dd_live_3c5d88e2…', 'r', '2026-04-01', '2026-06-28 14:03', '2026-06-30'),
  K('x1', 'xz', '幸真 Claude Code', 'dd_live_ab12cd34…', 'w', '2026-09-02', '2026-10-07 10:05', '2026-12-01'),
  K('x2', 'xz', '個人 claude.ai', 'dd_live_c91b05aa…', 'r', '2026-07-16', '2026-10-05 21:30', '2026-10-14'),
  K('x3', 'xz', '會議室電腦', 'dd_live_58de2f10…', 'w', '2026-08-25', '2026-10-03 15:48', '2026-11-23'),
  K('x4', 'xz', '舊筆電', 'dd_live_0b7a44d9…', 'w', '2026-03-02', '2026-05-29 11:20', '2026-05-31'),
  K('x5', 'xz', '試用金鑰', 'dd_live_e2461c8b…', 'r', '2026-06-18', '2026-06-30 09:15', '2026-09-16', '2026-07-02'),
  K('o1', 'ol', 'Oliver 唯讀 Claude', 'dd_live_41ac9e07…', 'r', '2026-09-20', '2026-10-07 08:50', '2026-12-19'),
  K('f1', 'fe', 'Felien Claude Code', 'dd_live_9d03b6f2…', 'w', '2026-08-30', '2026-10-06 17:25', '2026-11-28'),
  K('f2', 'fe', 'Felien 手機測試', 'dd_live_6a18c3e5…', 'r', '2026-06-02', null, '2026-08-31'),
  K('k1', 'ka', 'Karen 桌面版', 'dd_live_f4720d1b…', 'w', '2026-09-11', '2026-10-07 09:12', '2026-12-10'),
  K('k2', 'ka', 'Karen 備用', 'dd_live_2e95a7c0…', 'w', '2026-07-05', '2026-09-27 10:40', '2026-10-03', '2026-09-28'),
  K('e1', 'ra', 'Rae 筆電', 'dd_live_b83f06d4…', 'w', '2026-07-22', '2026-10-05 13:02', '2026-10-20'),
];
const kst = k => k.revoked ? 'rev' : (k.exp && daysTo(k.exp) < 0) ? 'exp' : (k.exp && daysTo(k.exp) < 14) ? 'soon' : 'ok';
const isActive = k => ['ok', 'soon'].includes(kst(k));
const KL = { ok: '有效', soon: '即將到期', exp: '已過期', rev: '已撤銷' };

const initMatrix = () => Object.fromEntries([...READ.map(t => [t[0], { def: true }]), ...WRITE.map(t => [t[0], { def: true, admin: true, member: true }])]);

function describe(tool, P, T) {
  const t5 = T.slice(0, 5);
  return ({
    get_project: [P, `{"project":"${P}"}`], search_tasks: ['狀態＝進行中', '{"status":"進行中","limit":20}'], get_task: [T, `{"task":"${t5}"}`], my_tasks: ['我的任務', '{"role":"owner"}'],
    create_task: [P, `{"project":"${P}","title":"整理素材清單"}`], update_task: [T, `{"task":"${t5}","status":"進行中","due":"2026-10-14"}`],
    create_subtask: [T, `{"task":"${t5}","title":"對稿","owner":"Karen"}`], update_subtask: [T + ' / 子任務 2', `{"task":"${t5}","sub":2,"note":"已與客戶確認"}`],
    set_subtask_done: [T + ' / 子任務 1', `{"task":"${t5}","sub":1,"done":true}`], create_project: [P, `{"name":"${P}"}`], rename_project: [P, `{"project":"${P}","name":"${P}（二期）"}`],
  })[tool] || ['—', '{}'];
}
/* 稽核資料（決定性偽亂數） */
function makeAudit(keys) {
  let seed = 7; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const kn = id => keys.find(k => k.id === id);
  const plan = [['rock', ['r1', 'r2'], 26], ['xz', ['x1', 'x2', 'x3'], 26], ['ol', ['o1'], 14], ['fe', ['f1'], 10], ['ka', ['k1'], 14], ['ra', ['e1'], 9]];
  const rows = [];
  for (const [u, kids, n] of plan) {
    let mins = 0;
    for (let i = 0; i < n; i++) {
      mins += i < n * 0.55 ? 6 + Math.floor(rnd() * 60) : 200 + Math.floor(rnd() * 1800);
      const key = kn(pick(kids));
      const isW = rnd() < (u === 'ol' ? 0.2 : 0.4);
      const tool = isW ? pick(WNAMES) : pick(READ.map(t => t[0]));
      const P = pick(PROJ), T = pick(TASK);
      const [target, params] = describe(tool, P, T);
      let res = '成功', why = '';
      if (isW && u === 'ol') { res = '被拒'; why = '角色為唯讀（viewer），不可寫入'; }
      else if (isW && key.scope === 'r') { res = '被拒'; why = '這把金鑰的範圍是唯讀'; }
      rows.push({ mins, u, key: key.name, tool, target, params, res, why, P, T });
    }
  }
  // 固定幾筆被拒／限速（示範）
  const force = (u, idx, res, why, tool) => { const r = rows.filter(x => x.u === u)[idx]; r.res = res; r.why = why; if (tool) { r.tool = tool; [r.target, r.params] = describe(tool, r.P, r.T); } };
  force('ol', 2, '被拒', '角色為唯讀（viewer），不可寫入', 'update_task');
  force('xz', 3, '限速', '寫入超過每分鐘 20 次，請稍後重試', 'create_subtask');
  force('xz', 6, '被拒', '你不是這個任務的關注人或執行人', 'update_task');
  force('rock', 4, '被拒', '參數不合法：status 只能是既有狀態之一', 'update_task');
  force('ka', 2, '限速', '寫入超過每分鐘 20 次，請稍後重試', 'create_subtask');
  force('ka', 3, '限速', '寫入超過每分鐘 20 次，請稍後重試', 'create_subtask');
  force('ka', 4, '限速', '寫入超過每分鐘 20 次，請稍後重試', 'create_subtask');
  const base = Date.UTC(2026, 9, 7, 10, 30);
  rows.forEach((r, i) => {
    const d = new Date(base - r.mins * 60000 + 8 * 3600000); // 顯示用當地時間（UTC+8）
    r.t = d.toISOString().slice(0, 16).replace('T', ' ');
    r.rid = 'req_' + (Math.floor(rnd() * 0xffffffff)).toString(16).padStart(8, '0');
    r.w = WNAMES.includes(r.tool);
  });
  rows.sort((a, b) => a.t < b.t ? 1 : -1);
  return rows;
}
const RATE = { r1: [38, 11, 0], r2: [12, 4, 0], x1: [41, 14, 2], x2: [18, 0, 0], x3: [22, 6, 0], o1: [27, 0, 0], f1: [33, 9, 0], k1: [58, 20, 6], e1: [14, 5, 0] };

/* ================= 狀態 ================= */
const newCf = () => ({ open: false, step: 'form', name: '', perm: 'w', exp: '90', adv: false, tools: Object.fromEntries(WNAMES.map(n => [n, true])), err: {}, key: null, ack: false });
let S;
function initState(keep) {
  const keys = initKeys();
  S = Object.assign({
    role: 'member', theme: 'light', writesOff: false, siteOff: false, rate: false, tab: 'cc', actF: 'all', allF: 'all', allOwner: 'all',
    af: { who: 'all', tool: 'all', res: 'all', date: '30' }, test: { phase: 'idle', val: '', shown: 0, res: null },
    cf: { d: newCf(), p: newCf() }, dlg: null, pConf: null, seed: 20261007, keys, audit: makeAudit(keys), mx: initMatrix(), killBy: ''
  }, keep || {});
  if (keep) { S.keys = keys; S.audit = makeAudit(keys); }
}
const me = () => ME[S.role], meName = () => USERS[me()].n;
const myKeys = () => S.keys.filter(k => k.owner === me());
const activeCount = o => S.keys.filter(k => k.owner === o && isActive(k)).length;
const allowedW = (role, t) => role !== 'viewer' && S.mx[t].def && (role === 'admin' ? S.mx[t].admin : S.mx[t].member);
const wCount = role => WNAMES.filter(t => allowedW(role, t)).length;

/* ================= 圖示 ================= */
const P = {
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>', shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>', dl: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
  plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>', plus: '<path d="M12 5v14M5 12h14"/>', lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
};
const ic = (n, s = 16) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${P[n]}</svg>`;
const cpBtn = (text, label = '複製', cls = 'sec sm') => `<button type="button" class="btn ${cls}" data-act="copy" data-copy="${esc(text)}">${ic('copy', 14)}<span>${label}</span></button>`;

/* ================= 小工具 ================= */
const pill = k => { const s = kst(k); return `<span class="pl ${s}">${KL[s]}${s === 'soon' ? ` · ${daysTo(k.exp)} 天` : ''}</span>`; };
const scope = k => k.scope === 'w' ? '<span class="pl rd">可寫</span>' : '<span class="pl gray">唯讀</span>';
const lastU = k => !k.last ? '<span class="dim">尚未使用</span>' : (k.last.slice(0, 10) === TODAY ? `今天 ${k.last.slice(11)}` : md(k.last.slice(0, 10)) + ' ' + k.last.slice(11));
const expT = k => k.exp ? md(k.exp) : '永不過期';
const resP = r => `<span class="pl ${r.res === '成功' ? 'ok' : r.res === '被拒' ? 'bad' : 'warn'}">${r.res}</span>`;
const trunc = (s, n = 38) => s.length > n ? s.slice(0, n) + '…' : s;
const statusPill = () => S.siteOff ? `<span class="pl bad big" id="stPill" data-st="site">${ic('ban', 14)}MCP 已全站停用</span>` : S.writesOff ? `<span class="pl warn big" id="stPill" data-st="writes">${ic('alert', 14)}寫入已被管理員停用</span>` : `<span class="pl ok big" id="stPill" data-st="ok">${ic('check', 14)}MCP 運作中</span>`;
function toast(m) { const h = $('#toastHost'), t = document.createElement('div'); t.className = 'toast'; t.textContent = m; h.appendChild(t); setTimeout(() => t.remove(), 2800); }

/* ================= 工具列 ================= */
function renderTb() {
  const ta = document.activeElement, tf = ta && ta.closest('#tb') ? { act: ta.dataset.act, a: ta.dataset.a } : null;
  const adm = S.role === 'admin';
  const J = (id, l) => `<a class="jl" href="#${id}" data-act="jump" data-a="${id}">${l}</a>`;
  $('#tb').innerHTML = `<div class="r1"><b>設定 › 遠端 MCP 設計稿</b><span class="lab">角色</span>
  <div class="seg tbseg" role="group" aria-label="切換角色">${[['member', '一般成員'], ['viewer', '唯讀成員(viewer)'], ['admin', '管理員']].map(([k, l]) => `<button type="button" data-act="role" data-a="${k}" aria-pressed="${S.role === k}">${l}</button>`).join('')}</div>
  <span class="lab">主題</span><div class="seg tbseg" role="group" aria-label="切換淺深色">${[['light', '淺色'], ['dark', '深色']].map(([k, l]) => `<button type="button" data-act="theme" data-a="${k}" aria-pressed="${S.theme === k}">${l}</button>`).join('')}</div>
  <span class="sp"></span><span class="lab">你是 ${esc(meName())}（${ROLE_LABEL[S.role]}）</span><button type="button" data-act="openCreate">開啟「建立金鑰」</button><button type="button" data-act="reset">重設示範資料</button></div>
  <div class="r2"><span class="lab">跳到</span>${[['sec-conn', '連線資訊'], ['sec-keys', '我的金鑰'], ['sec-guide', '連線教學'], ['sec-act', '最近活動'], ['sec-safe', '安全提醒']].map(a => J(...a)).join('')}
  ${adm ? `<span class="sep"></span><span class="lab">管理員</span>${[['sec-allkeys', '全部金鑰'], ['sec-kill', '緊急開關'], ['sec-mx', '允許清單'], ['sec-rate', '限速用量'], ['sec-audit', '稽核紀錄']].map(a => J(...a)).join('')}` : `<span class="lab">（管理員區塊：切到「管理員」才會出現）</span>`}
  <span class="sep"></span>${J('resp', '回應式預覽')}${J('stg', '狀態集')}</div>`;
  if (tf && tf.act) { const el = $(`#tb [data-act="${tf.act}"]${tf.a ? `[data-a="${tf.a}"]` : ''}`); el && el.focus({ preventScroll: true }); }
}

/* ================= 畫布 ================= */
function connCard() {
  const role = S.role, t = S.test, c = READ.length + wCount(role);
  const chip = ([n, d], w) => {
    const off = w && (S.writesOff || !allowedW(role, n)); const why = S.writesOff ? '已停用' : role === 'viewer' ? '唯讀不可用' : '未開放';
    return `<span class="tchip${w ? ' w' : ''}${off ? ' off' : ''}" title="${esc(d)}"><code>${n}</code>${off ? `<em class="sec">（${why}）</em>` : ''}</span>`;
  };
  const stepsHtml = () => {
    const names = ['網路', '金鑰', '工具清單'], sub = ['連到 /api/mcp', '驗證 Authorization 標頭', '取得可用工具'];
    return `<ol class="tsteps" id="tsteps" aria-label="測試連線結果">${names.map((n, i) => {
      if (t.phase === 'idle') return `<li class="skip"><span class="mk"></span><span>${n}<span class="msg">${sub[i]}</span></span></li>`;
      const r = t.res[i];
      if (i < t.shown && r) return `<li class="${r.ok ? 'okk' : 'bad'}"><span class="mk">${r.ok ? ic('check', 11) : ic('x', 11)}</span><span><b>${n}</b>：${r.ok ? '通過' : '失敗'}<span class="msg">${esc(r.msg)}</span></span></li>`;
      if (i === t.shown && t.phase === 'run') return `<li><span class="mk">…</span><span>${n}：檢查中…</span></li>`;
      return `<li class="skip"><span class="mk"></span><span>${n}：未執行</span></li>`;
    }).join('')}</ol>`;
  };
  const sum = t.phase === 'done' ? (t.res.every(r => r && r.ok) ? `<div class="note info" style="margin-top:10px">${ic('check')}<div><b>連線正常。</b>共 <b id="toolCount">${t.res[2].count}</b> 個工具可用（讀 ${READ.length}、寫 ${t.res[2].w}）。</div></div>` : '<div class="note red" style="margin-top:10px">' + ic('alert') + '<div><b>連線失敗。</b>請依上面紅字處理後再測一次。</div></div>') : '';

function spark(id, i) {
  const [r, w, n] = RATE[id]; let s = 11 + i * 7; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const pts = Array.from({ length: 24 }, (_, j) => Math.max(1, (r + w) * (.15 + .5 * rnd() + (j > 19 && n ? .35 : 0))));
  const mx = Math.max(...pts), p = pts.map((v, j) => `${(j * 4.1 + 2).toFixed(1)},${(22 - v / mx * 19).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="100" height="24" viewBox="0 0 100 24" role="img" aria-label="近 24 小時每小時請求量，峰值 ${r + w} 次／分"><polyline points="${p}" fill="none" stroke="var(--acc-solid)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

  <div class="frow" style="margin:12px 0 0"><span class="lab">每人合計（峰值／100）</span>${Object.entries(tot).map(([u, v]) => `<span class="pp2"><b>${esc(USERS[u].n)}</b><span class="mono">${v} / 100</span></span>`).join('')}</div></section>`;

  const mk = (t, d, btn, mini) => `<div class="scd"><h3>${t}</h3><div class="mini">${mini}</div><p>${d}</p><button type="button" class="btn sec sm" data-act="apply" data-a="${btn}">在上方示範</button></div>`;
  e.innerHTML = `<h2 id="stg-h">狀態集</h2><p class="lead">八種狀態；「在上方示範」會把上面的畫布切到該狀態（可用工具列的「重設示範資料」復原）。</p><div class="sgrid">
  ${mk('1 空狀態', '還沒有任何金鑰：純文字，不放插圖。', 'empty', '<b>我的金鑰 0 / 5</b><span class="sec">你還沒有金鑰。建立第一把金鑰後，才能讓你的 Claude 連到這個儀表板。</span>')}
  ${mk('2 金鑰剛建立（只顯示一次）', '完整金鑰只在這一刻看得到；勾選「我已複製並安全保存」才能關閉。', 'created', '<span class="pl bad">離開後無法再看到完整金鑰</span><code class="mono" style="font-size:11px">dd_live_DEMO…</code><span><input type="checkbox" disabled aria-label="示意"> 我已複製並安全保存　<span class="pl gray">關閉（停用）</span></span>')}
  ${mk('3 已過期金鑰', '過期不能再用、不能撤銷（本來就失效），不計入 5 把上限。', 'expired', '<span><b>舊筆電</b> <span class="pl exp">已過期</span></span><span class="sec">到期 05/31 · 無操作</span>')}
  ${mk('4 已撤銷金鑰', '撤銷立即生效；列留著，方便對照稽核紀錄。', 'revoked', '<span><b>試用金鑰</b> <span class="pl rev">已撤銷</span></span><span class="sec">撤銷於 07/02 · 無操作</span>')}
  ${mk('5 寫入被管理員停用', '連線資訊狀態變琥珀色；寫入工具劃線並標「已停用」，讀取不受影響。', 'writes', '<span class="pl warn">寫入已被管理員停用</span><span class="sec"><s>create_task</s> （已停用）<br>list_projects ✓</span>')}
  ${mk('6 被限速（429）', '寫入超過每分鐘 20 次：顯示還要等幾秒，活動紀錄標「限速」。', 'rate', '<span class="pl warn">HTTP 429 限速</span><span class="sec">寫入已用滿 20 / 20，38 秒後恢復。</span>')}
  ${mk('7 viewer（寫入停用）', '唯讀成員建立金鑰時「可寫」反灰並說明原因。', 'viewer', '<span class="sec"><input type="radio" checked disabled aria-label="唯讀"> 唯讀　<input type="radio" disabled aria-label="可寫（不可選）"> <s>可寫</s></span><span class="hint">你的帳號是唯讀成員，金鑰只能選唯讀。</span>')}
  ${mk('8 測試連線失敗（401）', '金鑰貼錯或已撤銷：用白話說明原因與下一步。', 'testfail', '<span class="pl bad">金鑰：失敗</span><span class="sec">401：這把金鑰無法使用——可能貼錯、已過期或已被撤銷。</span>')}</div>`;
  renderPhone();
}

/* ================= 動作 ================= */
function evalTest(val) {
  const res = []; const v = val.trim(), good = !v || v.startsWith('dd_live_DEMO');
  if (S.siteOff) { res.push({ ok: false, msg: '503：管理員已暫時全站停用 MCP。請稍後再試，或聯絡管理員。' }); return res; }
  res.push({ ok: true, msg: `連得到 ${URL_MCP}（TLS 正常，84 ms）` });
  if (!good) { res.push({ ok: false, msg: '401：這把金鑰無法使用——可能貼錯、已過期或已被撤銷。請確認貼的是完整金鑰（dd_live_ 開頭），或到「我的金鑰」建立新的。' }); return res; }
  res.push({ ok: true, msg: `金鑰有效（屬於 ${meName()}，角色：${ROLE_LABEL[S.role]}）` });
  const w = S.writesOff ? 0 : wCount(S.role), c = READ.length + w;
  res.push({ ok: true, count: c, w, msg: `取得 ${c} 個工具（讀 ${READ.length}、寫 ${w}${w === 0 ? (S.writesOff ? '：寫入已被管理員停用' : '：你的角色是唯讀') : ''}）` });
  return res;
}
let tTimer = null;
function runTest(instant) {
  if (S.test.phase === 'run') return;
  const res = evalTest(S.test.val);
  clearTimeout(tTimer);
  if (instant) { S.test = { ...S.test, phase: 'done', res, shown: res.length }; renderApp(); return; }
  S.test = { ...S.test, phase: 'run', res, shown: 0 }; renderApp();
  const tick = () => { S.test.shown++; if (S.test.shown >= res.length) { S.test.phase = 'done'; renderApp(); return; } renderApp(); tTimer = setTimeout(tick, 450); };
  tTimer = setTimeout(tick, 450);
}
function genKey() {
  const A = 'abcdefghijkmnpqrstuvwxyz23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = S.seed, o = 'dd_live_DEMO';
  for (let i = 0; i < 28; i++) { s = (s * 1664525 + 1013904223) >>> 0; o += A[s % A.length]; }
  S.seed = s; return o;
}
function submitCf(sf) {
  const f = S.cf[sf]; f.err = {}; const name = f.name.trim();
  if (!name) f.err.name = '請輸入金鑰名稱';
  else if (myKeys().some(k => k.name === name && isActive(k))) f.err.name = '已經有同名的有效金鑰，請換一個名字';
  if (f.exp === 'never' && S.role !== 'admin') f.err.exp = '永不過期需要管理員核准，一般成員請改選 180 天（或請管理員代為建立）。';
  if (S.role === 'viewer') f.perm = 'r';
  if (activeCount(me()) >= 5) f.err.name = '已達 5 把上限，請先撤銷不用的金鑰';
  if (f.err.name || f.err.exp) { sf === 'd' ? renderLayer() : renderPhone(); const el = $(f.err.name ? `#${sf}-name` : `#${sf}-exp`); el && el.focus(); return; }
  f.key = genKey(); f.step = 'created'; f.ack = false;
  S.keys.push(K('n' + (S.seed % 100000), me(), name, f.key.slice(0, 16) + '…', f.perm, TODAY, null, f.exp === 'never' ? null : addDays(TODAY, +f.exp)));
  S.pFresh = true; fresh = sf === 'd'; sf === 'd' ? renderLayer() : renderPhone(); renderApp(); sf === 'd' && renderPhone(); sf === 'p' && renderLayer();
}
function closeCf(sf) {
  S.cf[sf] = newCf();
  if (sf === 'd') closeDlg(); else { renderPhone(); const b = $('#pCreate'); b && b.focus({ preventScroll: true }); }
  renderApp(); renderPhone();
}
function revokeKey(id) { const k = S.keys.find(x => x.id === id); if (k) { k.revoked = TODAY; } }
function copyText(text, btn) {
  const done = ok => { const sp = btn.querySelector('span'); if (!sp) return; const o = btn.dataset.o || sp.textContent; btn.dataset.o = o; sp.textContent = ok ? '已複製 ✓' : '請手動複製'; clearTimeout(btn._t); btn._t = setTimeout(() => { sp.textContent = o; }, 1800); };
  const fb = () => { try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand && document.execCommand('copy'); ta.remove(); done(!!ok); } catch (e) { done(false); } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fb); else fb();
}
function setTheme(t) { S.theme = t; document.documentElement.setAttribute('data-theme', t); renderTb(); renderApp(); }
function setRole(r) { S.role = r; S.actF = 'all'; if (S.cf.d.step === 'form') S.cf.d.perm = r === 'viewer' ? 'r' : S.cf.d.perm; S.cf.p.perm = r === 'viewer' ? 'r' : S.cf.p.perm; S.test = { phase: 'idle', val: S.test.val, shown: 0, res: null }; S.pConf = null; renderTb(); renderApp(); renderPhone(); if (S.dlg) renderLayer(); }
function jump(id) { const el = document.getElementById(id); if (el) { el.scrollIntoView({ block: 'start' }); window.scrollBy(0, -86); } }
function applyState(k) {
  const m = me();
  if (k === 'empty') { S.keys = S.keys.filter(x => x.owner !== m); jump('sec-keys'); }
  else if (k === 'created') { S.cf.d = newCf(); Object.assign(S.cf.d, { name: '我的筆電 Claude Code', step: 'created', key: genKey() }); S.keys.push(K('n1', m, '我的筆電 Claude Code', S.cf.d.key.slice(0, 16) + '…', S.role === 'viewer' ? 'r' : 'w', TODAY, null, addDays(TODAY, 90))); if (S.role === 'viewer') S.cf.d.perm = 'r'; openDlg({ type: 'create' }); }
  else if (k === 'expired' || k === 'revoked') { const want = k === 'expired' ? 'exp' : 'rev'; if (!myKeys().some(x => kst(x) === want)) S.keys.push(k === 'expired' ? K('xe', m, '舊筆電', 'dd_live_0b7a44d9…', 'r', '2026-03-02', '2026-05-29 11:20', '2026-05-31') : K('xr', m, '試用金鑰', 'dd_live_e2461c8b…', 'r', '2026-06-18', '2026-06-30 09:15', '2026-09-16', '2026-07-02')); renderApp(); jump('sec-keys'); $$('#myKeys tbody tr').forEach(tr => { const x = S.keys.find(y => y.id === tr.dataset.kid); if (x && kst(x) === want) tr.classList.add('flash'); }); return; }
  else if (k === 'writes') { S.writesOff = true; S.killBy = 'Rock · 今天 10:12'; jump('sec-conn'); }
  else if (k === 'rate') { S.rate = true; S.actF = 'all'; jump('sec-conn'); }
  else if (k === 'viewer') { setRole('viewer'); S.cf.d = newCf(); S.cf.d.perm = 'r'; openDlg({ type: 'create' }); return; }
  else if (k === 'testfail') { S.test.val = 'dd_live_WRONG1234'; runTest(true); jump('sec-conn'); return; }
  renderTb(); renderApp(); renderPhone();
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, a = el.dataset.a;
  if (act === 'mback') { if (e.target === el && S.dlg && !(S.dlg.type === 'create' && S.cf.d.step === 'created')) closeDlg(); return; }
  if (act === 'pBack') { if (e.target === el && !(S.cf.p.step === 'created')) { S.cf.p = newCf(); renderPhone(); } return; }
  switch (act) {
    case 'copy': copyText(el.dataset.copy, el); break;
    case 'role': setRole(a); break;
    case 'theme': setTheme(a); break;
    case 'reset': { const keep = { role: S.role, theme: S.theme }; initState(keep); renderTb(); renderApp(); renderOuter(); renderLayer(); toast('已重設示範資料'); break; }
    case 'jump': e.preventDefault(); jump(a); break;
    case 'other': toast('這份設計稿只畫「Settings › 遠端 MCP」；其他畫面請看 desktop.html'); break;
    case 'noop': break;
    case 'test': runTest(); break;
    case 'gtab': S.tab = a; renderApp(); break;
    case 'actF': S.actF = a; renderApp(); break;
    case 'allF': S.allF = a; renderApp(); break;
    case 'openCreate': { const r = S.role; S.cf.d = newCf(); if (r === 'viewer') S.cf.d.perm = 'r'; openDlg({ type: 'create' }); break; }
    case 'revoke': openDlg({ type: 'revoke', id: a }); break;
    case 'disUser': openDlg({ type: 'disUser', id: a }); break;
    case 'killW': if (S.writesOff) { S.writesOff = false; S.killBy = ''; renderApp(); renderPhone(); toast('已恢復 MCP 寫入'); } else openDlg({ type: 'killW' }); break;
    case 'killS': if (S.siteOff) { S.siteOff = false; renderApp(); renderPhone(); toast('已恢復 MCP'); } else openDlg({ type: 'killS' }); break;
    case 'mxdef': { const m = S.mx[a]; m.def = !m.def; renderApp(); break; }
    case 'csv': toast('已產生 mcp-audit-2026-10-07.csv（示意，不會真的下載）'); break;
    case 'dlgClose': closeDlg(); break;
    case 'doRevoke': { const k = S.keys.find(x => x.id === S.dlg.id); revokeKey(S.dlg.id); closeDlg(); renderApp(); renderPhone(); toast(`已撤銷「${k.name}」`); break; }
    case 'doDis': { const u = S.dlg.id; S.keys.filter(k => k.owner === u && isActive(k)).forEach(k => revokeKey(k.id)); closeDlg(); renderApp(); renderPhone(); toast(`已停用 ${USERS[u].n} 的所有金鑰`); break; }
    case 'doKillW': S.writesOff = true; S.killBy = 'Rock · 今天 10:12'; closeDlg(); renderApp(); renderPhone(); toast('已停用所有 MCP 寫入'); break;
    case 'doKillS': S.siteOff = true; closeDlg(); renderApp(); renderPhone(); toast('已全站停用 MCP'); break;
    case 'cfSubmit': submitCf(a); break;
    case 'cfClose': if (!S.cf[a].ack) return; closeCf(a); break;
    case 'pOpen': S.cf.p = newCf(); S.cf.p.open = true; if (S.role === 'viewer') S.cf.p.perm = 'r'; S.pFresh = true; renderPhone(); break;
    case 'pClose': S.cf.p = newCf(); renderPhone(); { const b = $('#pCreate'); b && b.focus({ preventScroll: true }); } break;
    case 'pRev': S.pConf = a; renderPhone(); break;
    case 'pRevCancel': S.pConf = null; renderPhone(); break;
    case 'pRevOk': revokeKey(a); S.pConf = null; renderApp(); renderPhone(); toast('已撤銷'); break;
    case 'apply': applyState(a); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset.f) return;
  const [g, k] = el.dataset.f.split('.');
  if (g === 'test') S.test.val = el.value; else if (k === 'name') { S.cf[g].name = el.value; if (S.cf[g].err.name) { S.cf[g].err.name = ''; } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f) {
    const [g, k] = el.dataset.f.split('.'); if (g === 'test') return;
    const f = S.cf[g]; f[k] = el.type === 'checkbox' ? el.checked : el.value; if (k === 'exp') f.err.exp = '';
    g === 'd' ? renderLayer() : renderPhone();
  } else if (el.dataset.tool) { const [g, n] = el.dataset.tool.split('|'); S.cf[g].tools[n] = el.checked; g === 'd' ? renderLayer() : renderPhone(); }
  else if (el.dataset.mx) { const [n, r] = el.dataset.mx.split('|'); S.mx[n][r] = el.checked; renderApp(); }
  else if (el.dataset.sel) { const s = el.dataset.sel; if (s === 'allOwner') S.allOwner = el.value; else S.af[s.slice(2).toLowerCase()] = el.value; renderApp(); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.adv) S.cf[d.dataset.adv].adv = d.open; }, true);
document.addEventListener('keydown', e => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { const ids = ['cc', 'ai', 'json'], i = ids.indexOf(S.tab); S.tab = ids[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; renderApp(); $('#tab-' + S.tab).focus(); e.preventDefault(); return; }
  const layer = S.dlg ? $('#layer .dlg') : S.cf.p.open ? $('#phoneSheet') : null; if (!layer) return;
  const sf = S.dlg ? 'd' : 'p', cf = S.cf[sf], isCreate = !S.dlg || S.dlg.type === 'create';
  if (e.key === 'Escape') {
    e.preventDefault();
    if (isCreate && cf.step === 'created' && !cf.ack) { const n = $(`#${sf}-lose`); n && (n.classList.remove('shake'), void n.offsetWidth, n.classList.add('shake')); toast('請先複製金鑰並勾選「我已複製並安全保存」'); return; }
    if (isCreate) closeCf(sf); else closeDlg(); return;
  }
  if (e.key === 'Tab') {
    const vis = $$('button,input,select,textarea,summary,[tabindex="0"]', layer).filter(x => !x.disabled && x.tabIndex >= 0 && (x.tagName === 'SUMMARY' || !x.closest('details:not([open])'))); if (!vis.length) return;
    const first = vis[0], last = vis[vis.length - 1];
    if (e.shiftKey && (document.activeElement === first || !layer.contains(document.activeElement))) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && (document.activeElement === last || !layer.contains(document.activeElement))) { first.focus(); e.preventDefault(); }
  }
});

/* ================= 啟動 ================= */
function init() {
  initState();
  const q = new URLSearchParams(location.search);
  if (['member', 'viewer', 'admin'].includes(q.get('role'))) S.role = q.get('role');
  if (q.get('theme') === 'dark') { S.theme = 'dark'; document.documentElement.setAttribute('data-theme', 'dark'); }
  if (q.get('writes') === 'off') { S.writesOff = true; S.killBy = 'Rock · 今天 10:12'; }
  if (q.get('site') === 'off') S.siteOff = true;
  if (q.get('rate') === '1') S.rate = true;
  if (['cc', 'ai', 'json'].includes(q.get('tab'))) S.tab = q.get('tab');
  if (q.get('af')) S.actF = q.get('af');
  if (q.get('empty') === '1') S.keys = S.keys.filter(k => k.owner !== me());
  if (S.role === 'viewer') { S.cf.d.perm = 'r'; S.cf.p.perm = 'r'; }
  if (q.get('test') === 'ok') { S.test.val = ''; S.test.phase = 'idle'; }
  renderTb(); renderApp(); renderOuter();
  if (q.get('test') === 'ok') runTest(true);
  if (q.get('test') === 'fail') { S.test.val = 'dd_live_WRONG1234'; runTest(true); }
  const m = q.get('modal');
  if (m === 'create') openDlg({ type: 'create' });
  else if (m === 'adv') { S.cf.d.adv = true; openDlg({ type: 'create' }); }
  else if (m === 'created') applyState('created');
  else if (m === 'revoke') { const k = myKeys().find(isActive); openDlg({ type: 'revoke', id: k.id }); }
  else if (m === 'killwrite') openDlg({ type: 'killW' });
  else if (m === 'killsite') openDlg({ type: 'killS' });
  else if (m === 'disuser') openDlg({ type: 'disUser', id: 'ka' });
  const p = q.get('phone');
  if (p === 'sheet') { S.cf.p.open = true; S.pFresh = false; renderPhone(); }
  if (p === 'created') { S.cf.p = Object.assign(newCf(), { open: true, name: '手機測試金鑰', step: 'created', key: genKey() }); S.keys.push(K('np', me(), '手機測試金鑰', S.cf.p.key.slice(0, 16) + '…', S.role === 'viewer' ? 'r' : 'w', TODAY, null, addDays(TODAY, 90))); renderApp(); renderPhone(); }
  if (location.hash.length > 1) setTimeout(() => jump(location.hash.slice(1)), 0);
}
init();
