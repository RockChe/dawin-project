const tb=document.getElementById('tb');
ROWS.forEach((r,i)=>{
  const lostH=r.lost.map(t=>pill(t,'lost')).join(''),keep=r.from.filter(t=>!r.lost.includes(t)).map(t=>pill(t)).join('');
  const toH=r.to.map(t=>pill(t,r.gained.includes(t)?'new':'')).join('');
  const subs=r.subs.map(s=>`<div class="sub ${s.done?'done':''}">${s.done?'✓ ':'· '}${esc(s.name)} → ${s.owner.length?s.owner.map(t=>pill(t)).join(''):'<i>（無）</i>'}</div>`).join('');
  const cls=r.lost.length?'warn':'ok';
  const opts=r.subs.map((s,k)=>`<option value="${k}">${esc(s.name.slice(0,24))}</option>`).join('');
  const tr=document.createElement('tr');tr.className=cls;
  tr.innerHTML=`<td>${i+1}</td><td><b>${esc(r.task)}</b><br><span style="color:#5b6676;font-size:12px">${esc(r.project)}</span></td><td>${lostH}${keep}</td><td>${subs}</td><td>${toH}</td>

});
tb.addEventListener('change',e=>{if(e.target.classList.contains('act')){e.target.parentNode.querySelector('.tg').style.display=e.target.value==='add'?'block':'none'}});

document.getElementById('cp').onclick=()=>{
  const L=[];ROWS.forEach((r,i)=>{const td=tb.children[i],a=td.querySelector('.act').value,note=td.querySelector('.note').value.trim();
    let s=`#${i+1} ${r.task}｜`;
